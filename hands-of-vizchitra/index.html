<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hands of Vizchitra — Spinfinity</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    /* DATA colors, not theme: highlighter markers matched to Aditi's real
       Vizchitra hand (Develop=blue, Collect=yellow, Design=pink,
       Narrate=orange, Analyze=green). Bright + saturated so multiply-overlap
       reads like real marker. Page chrome uses the theme-paper tokens
       from /styles.css. */
    --develop:#3aa5e0; --collect:#f4e11e; --design:#ff5bb0;
    --narrate:#ff8a3d; --analyze:#7ed957;
    /* The paper roll the hands were traced on — a content surface (like the
       marker colors), distinct from the theme's --bg page ground. */
    --paper:#f5f1e8; --paper-2:#efe9dc; --paper-edge:#d8cfbd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--hand);}
  body{min-height:100vh;}
  header{padding:24px 30px 0;max-width:1120px;}
  .eyebrow{font-family:var(--hand);font-weight:700;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin:0 0 10px;}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,5.4vw,58px);
    margin:0;line-height:1.02;}
  .lede{font-size:15.5px;color:var(--muted);margin:14px 0 0;max-width:640px;line-height:1.55;}

  /* legend as marker swatches, not neat dots */
  .key{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 0;
    font-family:var(--hand);font-size:12.5px;}
  .key span{display:inline-flex;align-items:center;gap:7px;color:var(--muted);}
  .swatch{width:22px;height:11px;border-radius:2px;display:inline-block;
    transform:rotate(-2deg);mix-blend-mode:multiply;opacity:.85;}

  .status{font-family:var(--hand);font-size:12.5px;color:var(--muted);
    padding:10px 30px 0;}

  .stripwrap{position:relative;margin-top:14px;padding:6px 0 44px;}
  .strip{
    display:grid;
    /* smaller min => more hands per row => the whole field reads at once */
    grid-template-columns:repeat(auto-fill, minmax(var(--tw), 1fr));
    gap:0; align-items:center; justify-items:center;
    padding:34px 20px 40px;
    border-top:1px solid var(--paper-edge);border-bottom:1px solid var(--paper-edge);
    /* the long paper roll: cream ground + faint tooth, distinct from the page */
    background-color:var(--paper);
    background-image:
      radial-gradient(var(--paper-2) 1px, transparent 1.4px),
      radial-gradient(var(--paper-2) 1px, transparent 1.4px);
    background-size:22px 22px, 22px 22px;
    background-position:0 0, 11px 11px;
  }
  /* Phone: pack 3 across (was 2) so you still get the mass on a small screen */
  @media (max-width:520px){
    .strip{grid-template-columns:repeat(3, 1fr); padding:22px 6px 26px;
      row-gap:14px; column-gap:3px;}
    .tile .card{width:100%; height:auto; aspect-ratio:var(--tw) / var(--th);}
    /* smaller nudge + gentler lean + slight shrink so tilted hands never collide */
    .tile{transform:
      translate(calc(var(--dx,0)*.3), calc(var(--dy,0)*.3))
      rotate(calc(var(--rot,0)*.5)) scale(calc(var(--scl,1) * .92));}
    .strip.view-fit .tile{transform:
      rotate(calc(var(--rot,0)*.5)) scale(var(--scl,1));}
  }
  @media (max-width:360px){
    .strip{grid-template-columns:repeat(2, 1fr);}
  }

  .tile{
    display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:0;border-radius:10px;
    /* seeded jitter: lean + nudge + slight scale => tacked-to-a-wall messiness */
    transform:translate(var(--dx,0), var(--dy,0)) rotate(var(--rot,0)) scale(var(--scl,1));
    transition:transform .18s ease, filter .18s ease;
  }
  .tile.clickable{cursor:pointer;}
  .tile.clickable:hover{
    /* on hover, straighten up and lift above neighbours to read clearly */
    transform:translate(var(--dx,0), calc(var(--dy,0) - 8px)) rotate(0deg) scale(1.06);
    z-index:50 !important; filter:drop-shadow(0 6px 10px rgba(80,32,100,.18));
  }
  .tile .card{position:relative;width:var(--tw);height:var(--th);}
  .tile svg{display:block;width:100%;height:100%;overflow:visible;}
  .tile .nm{font-family:var(--hand);font-size:11px;color:var(--muted);
    max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    margin-top:0;opacity:0;transition:opacity .15s;}
  .tile:hover .nm{opacity:.9;}
  .tile .nm.unk{color:var(--muted);font-style:italic;}
  .tile .hint{display:none;}
  .tile.pair .card::after{content:"";position:absolute;inset:-4px -8px;
    border:1px dashed var(--border);border-radius:12px;pointer-events:none;}

  /* ---- view toggle -------------------------------------------------------- */
  .viewbar{display:flex;gap:14px;justify-content:center;align-items:center;
    flex-wrap:wrap;margin:16px 0 2px;}
  .vb-views{display:flex;gap:6px;}
  .vb-search{position:relative;display:flex;align-items:center;gap:8px;}
  .vb-search input{
    font-family:var(--hand);font-size:12.5px;color:var(--text);
    background:var(--card-bg);border:1px solid var(--border);border-radius:999px;
    padding:6px 15px;width:190px;outline:none;transition:border-color .15s, width .18s;}
  .vb-search input::placeholder{color:var(--muted);}
  .vb-search input:focus{border-color:var(--accent2);width:220px;}
  .search-count{font-family:var(--hand);font-size:11px;color:var(--muted);
    min-width:40px;}
  /* search states applied to tiles */
  .strip.searching .tile{opacity:.16;filter:grayscale(.5);transition:opacity .18s, filter .18s;}
  .strip.searching .tile.match{opacity:1;filter:none;z-index:40;}
  /* always show the matched person's name, even in field/fit where nm is hidden */
  .strip.searching .tile.match .nm{opacity:.95 !important;display:block !important;}
  .vb-btn{font-family:var(--hand);font-weight:700;font-size:12px;letter-spacing:.02em;
    color:var(--muted);background:var(--card-bg);border:1px solid var(--border);
    border-radius:999px;padding:5px 15px;cursor:pointer;transition:all .15s;}
  .vb-btn:hover{color:var(--accent2);border-color:var(--accent2);}
  .vb-btn.active{background:var(--accent2);color:#fff;border-color:var(--accent2);}

  /* SCROLL mode: horizontal, but rows stagger so it's a messy band, not a line */
  /* SCROLL mode: horizontal, but rows stagger so it's a messy band, not a line.
     Give each column real width + gap and dampen the nudge so tilted hands in
     adjacent columns can't collide. */
  .strip.view-scroll{
    grid-template-columns:none;grid-auto-flow:column;
    grid-template-rows:repeat(3, auto);
    grid-auto-columns:calc(var(--tw) * 1.08);
    justify-content:start;align-content:center;
    overflow-x:auto;overflow-y:hidden;
    column-gap:14px; row-gap:6px;
    padding:30px 30px 34px;scroll-behavior:smooth;
  }
  .strip.view-scroll .tile{
    /* keep the lean, drop the horizontal nudge that caused column collisions */
    transform:translate(0, calc(var(--dy,0)*.5))
      rotate(calc(var(--rot,0)*.7)) scale(var(--scl,1));
  }
  .strip.view-scroll::-webkit-scrollbar{height:8px;}
  .strip.view-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

  /* FIT mode: every hand shrinks to fluid cells so ALL fit in one screen and
     FILL the viewport (both width and height). */
  .strip.view-fit{
    padding:8px 12px;gap:2px;
    grid-template-columns:repeat(var(--fit-cols, 11), 1fr);
    grid-auto-rows:var(--fit-rowh, auto);
  }
  .strip.view-fit .tile{
    transform:rotate(calc(var(--rot,0)*.7)) scale(var(--scl,1));
    width:100%; height:100%;
    justify-content:center;
  }
  .strip.view-fit .tile .card{
    width:auto; height:100%; max-width:100%;
    aspect-ratio:var(--tw) / var(--th);
  }
  .strip.view-fit .nm{display:none;}

  .panel{margin:20px 30px;max-width:700px;font-family:var(--hand);font-size:13px;
    color:var(--muted);}
  .panel textarea{width:100%;height:150px;background:var(--card-bg);color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:10px;
    font-family:ui-monospace,monospace;font-size:12px;}
  .panel button{margin-top:10px;background:var(--accent2);color:#fff;border:0;
    border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;
    font-family:var(--hand);}
  .hidden{display:none;}
  footer#footer{font-family:var(--hand);font-size:11.5px;color:var(--muted);
    padding:4px 30px 56px;max-width:820px;line-height:1.7;}
  footer#footer code{background:var(--border);padding:1px 5px;border-radius:4px;}

  /* lightbox — paper card, ink frame */
  #lb{position:fixed;inset:0;background:rgba(35,39,48,.72);
    backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;
    z-index:50;padding:24px;}
  #lb.open{display:flex;}
  .lbcard{display:flex;gap:26px;max-width:960px;max-height:88vh;background:var(--card-bg);
    border:1px solid var(--border);border-radius:16px;padding:22px;overflow:auto;
    box-shadow:0 8px 0 rgba(80,32,100,.25);}
  .lbleft{flex:1 1 42%;display:flex;flex-direction:column;min-width:220px;}
  .lbright{flex:1 1 44%;display:flex;flex-direction:column;gap:14px;min-width:260px;}
  .lbvisuals{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .lbcoded,.lbimgwrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .lblabel{font-family:var(--hand);font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);}
  .lbcodedslot{width:min(28vw,240px);}
  .lbhand{width:100%;height:auto;aspect-ratio:var(--tw) / var(--th);
    background:var(--paper);}
  .lbcard img{max-height:74vh;max-width:44vw;border-radius:8px;object-fit:contain;
    background:var(--card-bg);border:1px solid var(--border);}
  .lbimgwrap{align-items:center;justify-content:center;flex:1;
    min-width:200px;min-height:220px;}
  .lbloading{font-family:var(--hand);font-size:13px;color:var(--muted);
    padding:40px 30px;}
  .lbmiss{font-family:var(--hand);font-size:13px;color:var(--muted);
    text-align:center;padding:36px 24px;line-height:1.6;}
  .lbmiss a{color:var(--text);font-weight:700;}
  .lbinfo{min-width:230px;max-width:310px;font-family:var(--hand);
    display:flex;flex-direction:column;}
  .lbinfo h2{font-family:var(--display);font-weight:700;font-size:30px;
    margin:0 0 2px;color:var(--text);}
  .lbinfo .sub{font-size:12px;color:var(--muted);margin-bottom:14px;
    font-family:var(--hand);font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .chip{font-size:11.5px;border:0;color:var(--text);border-radius:999px;
    padding:3px 11px;background:rgba(63,167,150,.10);}
  /* rotate chips through the four accents: teal, lilac, yellow, purple */
  .chip:nth-child(4n+2){background:rgba(130,103,190,.10);}
  .chip:nth-child(4n+3){background:rgba(255,189,53,.14);}
  .chip:nth-child(4n+4){background:rgba(80,32,100,.08);}
  .ratings{font-size:12px;color:var(--muted);line-height:1.9;margin-bottom:14px;}
  .ratings b{color:var(--text);font-weight:700;}
  .note{font-family:var(--hand);font-size:13.5px;color:var(--text);
    font-style:italic;line-height:1.5;border-left:2px solid var(--accent2);
    padding-left:12px;margin-bottom:16px;}
  .lbopen{margin-top:auto;font-size:12px;color:var(--accent2);font-weight:700;
    text-decoration:none;border-bottom:1px solid var(--accent2);align-self:flex-start;
    padding-bottom:1px;}
  .lbclose{position:absolute;top:20px;right:26px;color:#fff;font-size:30px;
    cursor:pointer;font-family:var(--hand);line-height:1;}
  @media(max-width:680px){.lbcard{flex-direction:column;}
    .lbcard img{max-width:80vw;max-height:48vh;}}
</style>
</head>
<body class="theme-paper">
<div id="sf-nav-mount"></div>
<script src="/nav.js"></script>

<header>
  <p class="eyebrow">Vizchitra 2025 · participatory data viz</p>
  <h1>Hands of Vizchitra</h1>
  <div class="key">
    <span><i class="swatch" style="background:var(--develop)"></i>develop</span>
    <span><i class="swatch" style="background:var(--collect)"></i>collect</span>
    <span><i class="swatch" style="background:var(--design)"></i>design</span>
    <span><i class="swatch" style="background:var(--narrate)"></i>narrate</span>
    <span><i class="swatch" style="background:var(--analyze)"></i>analyze</span>
  </div>
</header>

<!-- Hidden stubs keep the existing JS element refs valid. -->
<div id="status" hidden></div>
<div id="pastePanel" class="hidden" hidden>
  <textarea id="csvText" hidden></textarea>
  <button id="renderBtn" hidden></button>
</div>

<div class="viewbar">
  <div class="vb-views">
    <button data-view="scroll" class="vb-btn active">scroll</button>
    <button data-view="fit" class="vb-btn">fit</button>
  </div>
  <div class="vb-search">
    <input id="nameSearch" type="search" placeholder="find your name…" autocomplete="off" />
    <span id="searchCount" class="search-count"></span>
  </div>
</div>
<div class="stripwrap"><div class="strip" id="strip"></div></div>
<footer id="footer" hidden></footer>

<div id="lb"><span class="lbclose" id="lbclose">×</span><div class="lbcard" id="lbcard"></div></div>

<script>
/* Minimal CSV fallback if the PapaParse CDN is blocked (keeps offline preview
   working). Handles quoted fields + commas. Real deploys use PapaParse. */
const CSVParse = (window.Papa && Papa.parse) ? (t)=>Papa.parse(t,{header:true,skipEmptyLines:true}).data
  : function(text){
      const rows=[]; let i=0,f="",row=[],q=false;
      const pushF=()=>{row.push(f);f="";}, pushR=()=>{if(row.length){rows.push(row);}row=[];};
      while(i<text.length){const c=text[i];
        if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
        else { if(c=='"')q=true; else if(c==',')pushF(); else if(c=='\n'){pushF();pushR();}
               else if(c=='\r'){} else f+=c; }
        i++; }
      if(f.length||row.length){pushF();pushR();}
      const head=rows.shift()||[];
      return rows.filter(r=>r.some(x=>x!=="")).map(r=>{const o={};head.forEach((h,j)=>o[h]=r[j]!==undefined?r[j]:"");return o;});
    };

/* ============================================================================
   HANDS OF VIZCHITRA — paper scaffold

   locating anchors/glyphs by layer-name id, and showing/hiding + arc-drawing
   per row. Pentagon arcs are code-drawn placeholders (clearly marked) until
   authored marker glyphs exist in the SVG.

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTc0BJUydiWxnGDh_y0_Jl7FaPysPX9CJnsmQ7IAn2zss2FarDqCyJGxWLDcLeZ5fSScWHmFyEeC47r/pub?output=csv";

document.documentElement.style.setProperty('--tw',TW+'px');
document.documentElement.style.setProperty('--th',TH+'px');

/* ---- id contract + shim -------------------------------------------------
   resolveId() tries the CLEAN name first, then falls back to the current
   messy export. Once you rename layers in Affinity and re-export, the clean
   names hit and the fallbacks are simply never used — no code change needed. */
const ID_ALIASES={
  // distance levels (innermost -> outermost). hand-all.svg uses these exact ids.
  "dist-under10": ["_-10","dist-under10","<10"],
  "dist-10-25":   ["_10-25","dist-10-25","10-25"],
  "dist-south":   ["South-India","dist-south"],
  "dist-north":   ["North-India","dist-north"],
  "dist-outside": ["Outside-India","dist-outside"],

  "cat": ["cat"], "dog": ["dog"], "both-pet": ["both-pets","both-pet"],
  // chrono — real sibling layers
  "morning": ["morning-person","morning"],
  "moon":    ["night-person","moon","night"],
  "both-chrono": ["both-person","both-chrono"],
  // viz-count — 6 authored levels (none..lostcount)
  "viz-notstarted": ["viz-count-notstartedyet"],
  "viz-1-10":       ["viz-count-onetoten"],
  "viz-11-50":      ["viz-count-eleventofifty"],
  "viz-51-100":     ["viz-count-fiftyonetoonehundred"],
  "viz-101-200":    ["viz-count-hundredonetotwohundred"],
  "viz-lostcount":  ["viz-count-lostcount"],
  // groups + knuckles
  "distance-travelled": ["distance-travelled"],
  "pinky-knuckle": ["pinky-knuckle"], "index-knuckle": ["index-knuckle"],
  "thumb-knuckle": ["thumb-knuckle"], "wrist-knuckle-orange": ["wrist-knuckle-orange"],
  "wrist-knuckle-teal": ["wrist-knuckle-teal"],
};

};
const VIZ_LAYERS=["viz-notstarted","viz-1-10","viz-11-50","viz-51-100","viz-101-200","viz-lostcount"];
function resolveEl(root, cleanName){
  const cands = ID_ALIASES[cleanName] || [cleanName];
  for(const c of cands){
    // getElementById-style lookup scoped to a cloned root
    const el = root.querySelector('[id="'+cssEscape(c)+'"]');
    if(el) return el;
  }
  return null;
}
function cssEscape(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/([^\w-])/g,'\\$1'); }

/* Knuckle anchors. Position comes from the SVG ellipse; COLOR comes from our

const low=v=>(v||"").toString().trim().toLowerCase();
const truthy=v=>/^(true|yes|y|1)$/.test(low(v));
// rate(): distinguish an explicit 0 from a blank/undrawn knuckle.
//  ""  -> null  (undrawn -> hollow ring)
//  "0" -> 0     (deliberate zero -> bare dot, no arcs)
function rate(v){ const t=(v==null?"":String(v)).trim(); if(t==="") return null;
  const n=parseInt(t,10); return isNaN(n)?null:Math.max(0,Math.min(5,n)); }

function normRow(raw){
  const k={}; for(const key in raw) k[key.trim().toLowerCase()]=raw[key];
  const g=n=>k[n]!==undefined?k[n]:"";
  let photo="";
  for(const key in k){ if(/photo|image|link|url|pic|drive/i.test(key)&&low(k[key]).startsWith("http")){photo=k[key].trim();break;} }
  const lb=low(g("lives_in_bangalore"));
  // SVG is drawn as a LEFT hand = lives in Bangalore = base orientation.
  // Mirror only when the sheet explicitly says outside (right / no). Unknown
  // (e.g. the pair hand) stays base.
  const mirror=lb.includes("right")||lb==="no"||lb==="n"||lb==="false";
  const inBangalore=!mirror;
  const pet=low(g("pet")),viz=low(g("viz_count")),trv=low(g("travel")),ch=low(g("chronotype"));
  const nameRaw=(g("name")||"").toString().trim();
  return {
    id:(g("id")||"").toString().trim(),
    name:nameRaw,
    pair:/[,&/]|\band\b/i.test(nameRaw),      // "SURBHI & ZAINA" -> pair hand
    uncertain:truthy(g("name_uncertain")),
    mirror, inBangalore,                        // mirror=true renders the outside-Bangalore (right) hand
    develop:rate(g("enjoy_develop")),collect:rate(g("enjoy_collect")),
    design:rate(g("enjoy_design")),narrate:rate(g("enjoy_narrate")),
    analyze:rate(g("enjoy_analyze")),
    pet:["dog","cat","both","other","none"].includes(pet)?pet:"",
    viz:VIZ.includes(viz)?viz:"", travel:TRV.includes(trv)?trv:"",
    chrono:["morning","night","both"].includes(ch)?ch:"",
    notes:(g("notes")||"").toString().trim(), photo
  };
}
// filter the legend/hint row and fully empty rows
function isHint(d){return low(d.id).startsWith("text")||/image filename/.test(low(d.id))||low(d.name)==="fourth/ring finger";}
function isEmpty(d){return !(d.id||d.name||d.photo||d.pet||d.viz||d.travel||d.chrono
  ||d.develop!=null||d.collect!=null||d.design!=null||d.narrate!=null||d.analyze!=null);}

/* ---- SVG source + one-time anchor read ----------------------------------
   We read knuckle centers ONCE from a hidden measuring copy using getBBox()
   in real viewBox space, then reuse those centers for every tile (all hands
   share the same outline geometry; flip is handled by mirroring the arc x). */
const SVG_MARKUP = document.getElementById("handSvgSource").innerHTML;
let ANCHORS=null;          // {develop:{x,y,col}, ...}  + _centroid, _missing
const MISSING=new Set();   // ids the scaffold looked for but couldn't find

function readAnchors(){
  const probe=document.createElement("div");
  probe.style.cssText="position:absolute;left:-99999px;top:0;width:400px;height:600px;";
  probe.innerHTML=SVG_MARKUP;
  document.body.appendChild(probe);
  const svg=probe.querySelector("svg");
  // sync VB to whatever this SVG actually uses (hand-all.svg = 1640x2360)
  const vb=(svg.getAttribute("viewBox")||"").split(/[\s,]+/).map(Number);
  if(vb.length===4 && vb[2] && vb[3]){ VB.w=vb[2]; VB.h=vb[3];
    document.documentElement.style.setProperty('--tw',TW+'px');
  }
  // Resolve an element's local point into ROOT viewBox coordinates.
  // el.getScreenCTM() = local -> screen; svg.getScreenCTM() = viewBox -> screen.
  // Composing local->screen->viewBox (via the svg's inverse) cancels the render
  // scale, so we get exact viewBox user units regardless of the probe's pixel
  // size. This bakes in every parent matrix() transform Affinity emitted, so
  // knuckles with shared local coords but different parent transforms land in
  // their true positions. Layout-scale independent and nesting-agnostic.
  const svgToScreen = svg.getScreenCTM();
  const screenToVB  = svgToScreen ? svgToScreen.inverse() : null;
  function toViewBox(el){
    const b=el.getBBox();                          // local-space box
    const cx=b.x+b.width/2, cy=b.y+b.height/2;
    const local=el.getScreenCTM();                 // local -> screen
    if(!local||!screenToVB) return {x:cx, y:cy};   // fallback: assume root space
    const p=(new DOMPoint(cx,cy)).matrixTransform(local).matrixTransform(screenToVB);
    return {x:p.x, y:p.y};
  }
  const A={};
  for(const kn of KNUCKLES){
    const el=resolveEl(svg,kn.id);
    if(!el){ MISSING.add(kn.id); continue; }
    const c=toViewBox(el);
    A[kn.key]={x:c.x, y:c.y,
      col:getComputedStyle(document.documentElement).getPropertyValue(kn.col).trim()};
  }
  const pts=Object.values(A);
  A._centroid={x:pts.reduce((s,p)=>s+p.x,0)/pts.length,
               y:pts.reduce((s,p)=>s+p.y,0)/pts.length};
  for(const want of ["dog","moon","both-pet","both-chrono"]) if(!resolveEl(svg,want)) MISSING.add(want);
  probe.remove();
  return A;
}

/* ---- per-row hand ---------------------------------------------------------
   Clone the SVG, apply paper ink treatment, toggle glyphs for this row,
   overlay pentagon arcs. Returns an <svg> element. */
function buildHand(d){
  const wrap=document.createElement("div");
  wrap.innerHTML=SVG_MARKUP;
  const svg=wrap.querySelector("svg");
  svg.removeAttribute("width");svg.removeAttribute("height");
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");

  // Per-hand ink weight: some people pressed harder / used a fatter pen. Seeded
  // by id+name so it's stable across renders and independent of the tile jitter.
  const s2=[...(d.id+"~"+d.name)].reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,7);
  const inkMul=0.8+((Math.sin(s2*7.13)*0.5+0.5)*0.55);  // ~0.80–1.35

  paperTreatment(svg, inkMul);
  toggleGlyphs(svg,d);
  drawPentagon(svg,d);      // arcs drawn in BASE coords, appended to svg root

  // One mirror to rule them all: reflect the entire svg content for outside-
  // Bangalore hands, so the outline, glyphs, and arcs all flip together and
  // stay aligned. (Drawing in base coords + one transform = no per-arc math.)
  if(d.mirror){
    const NS="http://www.w3.org/2000/svg";
    const grp=document.createElementNS(NS,"g");
    grp.setAttribute("transform",`translate(${VB.w},0) scale(-1,1)`);
    while(svg.firstChild) grp.appendChild(svg.firstChild);
    svg.appendChild(grp);
  }
  drawName(svg,d);          // name added AFTER mirror -> upright letters, no flip
  return svg;
}

/* Recolor the drawn SVG for paper: knuckle fills -> soft ink rings, hand line
   stays ink. We keep each knuckle a faint tinted ring so the color mapping is
   still legible under the arcs. */
function paperTreatment(svg, inkMul=1){
  const round=(v)=>Math.round(v*inkMul);
  for(const kn of KNUCKLES){
    const el=resolveEl(svg,kn.id); if(!el) continue;
    const e=el.querySelector("ellipse")||el;
    e.style.fill="var(--paper)";
    e.style.stroke="var(--text)";
    e.style.strokeWidth=round(26)+"px";
  }
  // Kill the SVG-level default fill that makes the outline read as a black
  // silhouette; render the hand as ink LINE work so inside-glyphs stay visible.
  svg.style.fillRule="evenodd";
  const hand=resolveEl(svg,"hand");
  if(hand){
    const paths=[...hand.querySelectorAll("path")].sort((a,b)=>{
      const ba=a.getBBox(),bb=b.getBBox();return (bb.width*bb.height)-(ba.width*ba.height);});
    // largest path = the hand outline: no fill, firm ink stroke
    if(paths[0]){paths[0].style.fill="none";paths[0].style.stroke="var(--text)";
      paths[0].style.strokeWidth=round(20)+"px";paths[0].style.strokeLinejoin="round";}
    // remaining paths inside #hand are drawn detail (glyph line work): ink stroke,
    // keep them unfilled so they read as pen marks on paper.
    paths.slice(1).forEach(p=>{p.style.fill="none";p.style.stroke="var(--text)";
      if(!p.style.strokeWidth)p.style.strokeWidth=round(14)+"px";});
  }
  // Glyph groups (pets, chrono, distance, viz) sit as siblings of #hand.
  // IMPORTANT: these are finished hand-drawn glyphs with their OWN fills and
  // stroke weights (e.g. viz-count = a filled bulb + fine trailing strands).
  // Do NOT restructure them — only recolor the artist's near-black ink to our
  // paper --ink so it matches the palette. Leave fill-vs-stroke exactly as drawn.
  const isDark=(c)=>{
    c=(c||"").trim().toLowerCase();
    if(!c||c==="none"||c==="transparent") return false;
    if(c==="black"||c==="#000"||c==="#000000") return true;
    const m=c.match(/rgba?\(([^)]+)\)/);
    if(m){ const [r,g,b]=m[1].split(",").map(n=>parseFloat(n)); return (r+g+b)/3 < 90; }
    const h=c.match(/^#([0-9a-f]{6})$/);
    if(h){ const n=parseInt(h[1],16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return (r+g+b)/3<90; }
    return false;
  };
  for(const gid of ["cat","dog","both-pet","morning","moon","both-chrono",
                    "distance-travelled",...VIZ_LAYERS]){
    const el=resolveEl(svg,gid); if(!el) continue;
    el.querySelectorAll("path,ellipse,circle,line,polyline,polygon").forEach(p=>{
      const cs=getComputedStyle(p);
      // recolor dark fills to ink, keep light/none fills as-is
      if(isDark(p.style.fill||cs.fill)) p.style.fill="var(--text)";
      // recolor dark strokes to ink; leave stroke width/caps as authored
      if(isDark(p.style.stroke||cs.stroke)) p.style.stroke="var(--text)";
    });
  }
}

/* Show/hide glyphs for this row. Missing optional glyphs fall back to a small
   code-drawn mark so the row still renders. */
function toggleGlyphs(svg,d){
  const showOnly=(cands,pick)=>{
    // hide all candidates, then show the picked one if present
    let shown=null;
    for(const name of cands){ const el=resolveEl(svg,name); if(el) el.style.display="none"; }
    if(pick){ const el=resolveEl(svg,pick); if(el){el.style.display="";shown=el;} }
    return shown;
  };
  // PET — all three now authored as sibling layers in hand-all.svg
  const petPick={cat:"cat",dog:"dog",both:"both-pet"}[d.pet]||null;
  showOnly(["cat","dog","both-pet"], petPick);

  // CHRONO — morning-person / night-person / both-person
  const chPick={morning:"morning",night:"moon",both:"both-chrono"}[d.chrono]||null;
  showOnly(["morning","moon","both-chrono"], chPick);

  // DISTANCE — cumulative nested reveal, innermost-out
  const distG=resolveEl(svg,"distance-travelled");
  if(distG){
    const n=TRAVEL_TO_LEVEL[d.travel]||0;
    DIST_LEVELS.forEach((lvl,i)=>{ const el=resolveEl(svg,lvl);
      if(el) el.style.display = (CUMULATIVE.distance ? (i<n) : (i===n-1)) ? "" : "none"; });
    distG.style.display = d.travel ? "" : "none";
  }

  // VIZ-COUNT — six authored levels, SELECT ONE (not cumulative).
  // d.viz is a bucket string (none|1-10|11-50|51-100|101-200|lost_count).
  const vizPick=VIZ_TO_LAYER[d.viz]||null;
  showOnly(VIZ_LAYERS, vizPick);   // hides all six, shows the matching one
}

/* Minimal code-drawn fallback glyphs, in viewBox coords, near a finger.
   These are deliberately rough placeholders for not-yet-drawn variants. */
function codeGlyph(svg,slot,val){
  const NS="http://www.w3.org/2000/svg";
  const g=document.createElementNS(NS,"g");
  g.setAttribute("data-fallback",slot+":"+val);
  // rough finger positions in viewBox space (index/middle splay)
  const at=slot==="pet"?{x:4700,y:6400}:{x:5200,y:3200};
  const put=(el,attrs)=>{for(const k in attrs)el.setAttribute(k,attrs[k]);g.appendChild(el);return el;};
  const stroke={fill:"none",stroke:"var(--text)","stroke-width":34,"stroke-linecap":"round"};
  if(slot==="pet"&&val==="dog"){
    put(document.createElementNS(NS,"circle"),{cx:at.x,cy:at.y,r:120,...stroke});
    put(document.createElementNS(NS,"ellipse"),{cx:at.x-95,cy:at.y-70,rx:45,ry:80,...stroke});
    put(document.createElementNS(NS,"ellipse"),{cx:at.x+95,cy:at.y-70,rx:45,ry:80,...stroke});
  }else if(slot==="pet"&&val==="both"){
    put(document.createElementNS(NS,"circle"),{cx:at.x-70,cy:at.y,r:90,...stroke});
    put(document.createElementNS(NS,"circle"),{cx:at.x+70,cy:at.y,r:90,...stroke});
  }else if(slot==="chrono"&&val==="night"){
    put(document.createElementNS(NS,"path"),
      {d:`M ${at.x+120} ${at.y} a 130 130 0 1 1 -120 -175 a 100 100 0 1 0 120 175 z`,
       fill:"var(--text)",stroke:"none"});
  }else if(slot==="chrono"&&val==="both"){
    put(document.createElementNS(NS,"circle"),{cx:at.x,cy:at.y,r:70,...stroke});
    for(let a=0;a<360;a+=45){const t=a*Math.PI/180;
      put(document.createElementNS(NS,"line"),
        {x1:at.x+Math.cos(t)*95,y1:at.y+Math.sin(t)*95,
         x2:at.x+Math.cos(t)*135,y2:at.y+Math.sin(t)*135,...stroke});}
  }else{ // generic dot
    put(document.createElementNS(NS,"circle"),{cx:at.x,cy:at.y,r:60,...stroke});
  }
  svg.appendChild(g);
}

/* ---- pentagon arcs (CODE, highlighter) -----------------------------------
   Each knuckle emits `rating` concentric bands that sweep ACROSS the palm,
   centered on the knuckle, wide enough to cross the pentagon centroid so
   colors from different knuckles overlap in the middle and multiply — the
   woven center is the point (see Aditi's real Vizchitra hand).
   Still swappable for authored marker glyphs later: same per-knuckle loop. */
function drawPentagon(svg,d){
  if(!ANCHORS) return;
  const NS="http://www.w3.org/2000/svg";
  const cen={x:ANCHORS._centroid.x, y:ANCHORS._centroid.y};   // base coords; mirror handled by parent transform
  const rng=mulberry32(hashStr((d.id||d.name||"x")+"|arc"));

  // ordered knuckle points (pentagon vertices, in KNUCKLES order)
  const P=KNUCKLES.map(k=>({kn:k, a:ANCHORS[k.key]})).filter(o=>o.a);
  if(P.length<3) return;
  const pts=P.map(o=>o.a);
  const meanR=pts.reduce((s,a)=>s+Math.hypot(a.x-cen.x,a.y-cen.y),0)/pts.length;

  // ---- pentagon geometry (slightly hand-wobbled vertices) ----
  const V=pts.map(a=>[a.x+(rng()-0.5)*14, a.y+(rng()-0.5)*14]);
  const polyPts=V.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");

  // unique clip id per hand
  const clipId="pent-"+hashStr((d.id||d.name||"x")).toString(36);
  const defs=document.createElementNS(NS,"defs");
  const clip=document.createElementNS(NS,"clipPath");
  clip.setAttribute("id",clipId);
  const clipPoly=document.createElementNS(NS,"polygon");
  clipPoly.setAttribute("points",polyPts);
  clip.appendChild(clipPoly); defs.appendChild(clip);
  svg.appendChild(defs);

  // ---- 1. ARCS, clipped to the pentagon, multiply-blended ----
  const arcs=document.createElementNS(NS,"g");
  arcs.setAttribute("clip-path",`url(#${clipId})`);
  arcs.setAttribute("style","mix-blend-mode:multiply");
  for(const o of P){
    const a=o.a, val=d[o.kn.key];
    if(val==null||val===0) continue;            // no arcs for undrawn / zero
    const cx=a.x, cy=a.y, col=cssVar(o.kn.col);
    const ang=Math.atan2(cen.y-cy, cen.x-cx);
    const half=1.45;                             // wide sweep; clip trims overflow
    // Radii are DISTRIBUTED, not stepped: bands span from just outside the
    // knuckle (inner) to just past the centroid (outer). meanR = knuckle→centroid
    // distance, so an arc of radius meanR passes through the center; capping the
    // outermost band at ~meanR*1.06 makes it "finish a lil above the center."
    // This holds for val=1..5 — the top band always lands in-clip, never beyond.
    const inner=meanR*0.42, outer=meanR*1.06;
    for(let k=1;k<=val;k++){
      const jr=(rng()-0.5)*meanR*0.05;
      const a0=ang-half+(rng()-0.5)*0.16, a1=ang+half+(rng()-0.5)*0.16;
      const dx=(rng()-0.5)*meanR*0.04, dy=(rng()-0.5)*meanR*0.04;
      // even spread; single-band ratings sit near the center line
      const t = val===1 ? 0.7 : (k-1)/(val-1);
      const r = inner + (outer-inner)*t + jr;
      const p=document.createElementNS(NS,"path");
      p.setAttribute("d",wobbleArc(cx+dx,cy+dy,r,a0,a1,rng,meanR));
      p.setAttribute("style",
        `fill:none;stroke:${col};stroke-width:${Math.round(meanR*0.11)};`+
        `stroke-linecap:round;opacity:.5`);
      arcs.appendChild(p);
    }
  }
  svg.appendChild(arcs);

  // ---- 2. PENTAGON marker outline (thick ink line connecting the circles) ----
  const line=document.createElementNS(NS,"polygon");
  line.setAttribute("points",polyPts);
  line.setAttribute("style",
    `fill:none;stroke:var(--text);stroke-width:${Math.round(meanR*0.09)};`+
    `stroke-linejoin:round;stroke-linecap:round`);
  svg.appendChild(line);

  // ---- 3. FAT marker rings at each knuckle (colored fill + thick ink ring) ----
  for(const o of P){
    const a=o.a, col=cssVar(o.kn.col), val=d[o.kn.key];
    const R=Math.round(meanR*0.16);              // fat ring
    const cx=a.x+(rng()-0.5)*6, cy=a.y+(rng()-0.5)*6;
    // colored marker fill (skip fill for undrawn -> hollow)
    if(val!=null){
      const fill=document.createElementNS(NS,"circle");
      fill.setAttribute("cx",cx);fill.setAttribute("cy",cy);fill.setAttribute("r",R);
      fill.setAttribute("style",`fill:${col};opacity:.9`);
      svg.appendChild(fill);
    }
    // thick ink outline ring
    const ring=document.createElementNS(NS,"circle");
    ring.setAttribute("cx",cx);ring.setAttribute("cy",cy);ring.setAttribute("r",R);
    ring.setAttribute("style",
      `fill:none;stroke:var(--text);stroke-width:${Math.round(meanR*0.055)};`+
      (val==null?"stroke-dasharray:20 16;opacity:.5":"opacity:.92"));
    svg.appendChild(ring);
  }

  // ---- helpers ----
  function wobbleArc(cx,cy,r,a0,a1,rng,scale){
    const N=7, sp=[];
    for(let i=0;i<=N;i++){
      const t=i/N, ang=a0+(a1-a0)*t;
      const rr=r+(rng()-0.5)*scale*0.03;
      sp.push([cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr]);
    }
    let dP=`M ${sp[0][0].toFixed(1)} ${sp[0][1].toFixed(1)}`;
    for(let i=0;i<sp.length-1;i++){
      const p0=sp[i-1]||sp[i], p1=sp[i], p2=sp[i+1], p3=sp[i+2]||p2;
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      dP+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return dP;
  }
}
/* Write the person's name along their finger. PREFERRED: author a path/line in
   the SVG named "name-line" running knuckle->fingertip (that direction sets the
   reading direction). If present we bind the name to a copy of it, so placement
   and flip are exact and it rides inside the mirror group automatically. If it's
   absent we fall back to an estimated index-finger centerline. */
function drawName(svg,d){
  const NS="http://www.w3.org/2000/svg";
  // Always hide the authored guide line first, even for blank/pair hands, so the
  // guide never renders as a stray stroke.
  const guide=resolveEl(svg,"Name-guide") || resolveEl(svg,"name-line") || resolveEl(svg,"name-guide");
  if(guide) guide.style.display="none";

  const name=(d.name||"").trim();
  if(!name || d.pair) return;                 // no name to draw
  const pathId="namepath-"+hashStr(d.id+d.name);

  // Build the name path from the authored guide (tip->knuckle in the SVG).
  let dP=null;
  if(guide){
    const g=guide.tagName.toLowerCase();
    if(g==="line"){
      dP=`M ${+guide.getAttribute("x1")} ${+guide.getAttribute("y1")} `+
         `L ${+guide.getAttribute("x2")} ${+guide.getAttribute("y2")}`;
    }else if(g==="path"){ dP=guide.getAttribute("d"); }
    else{ const b=guide.getBBox(); dP=`M ${b.x} ${b.y+b.height} L ${b.x+b.width*0.4} ${b.y}`; }
  }
  // Fallback estimate if no guide present.
  if(!dP) dP=`M 360 300 L 430 1000`;

  // The hand is mirrored via translate(W,0) scale(-1,1); the name text lives at
  // the (unflipped) root so its letters stay upright. A finger authored at base-x
  // renders at (W - base-x) after the hand flips, so to keep the name ON that
  // finger we mirror the PATH's x for right hands. (Text upright, path follows
  // the finger to the opposite side.)
  if(d.mirror) dP=flipPathX(dP, VB.w);

  const defs=document.createElementNS(NS,"defs");
  const path=document.createElementNS(NS,"path");
  path.setAttribute("id",pathId); path.setAttribute("d",dP); path.setAttribute("fill","none");
  defs.appendChild(path); svg.appendChild(defs);

  const tmp=document.createElementNS(NS,"path"); tmp.setAttribute("d",dP);
  svg.appendChild(tmp); let L=300; try{L=tmp.getTotalLength();}catch(e){} tmp.remove();

  const text=document.createElementNS(NS,"text");
  const tp=document.createElementNS(NS,"textPath");
  tp.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#"+pathId);
  tp.setAttribute("href","#"+pathId);
  tp.setAttribute("startOffset","2%");
  tp.setAttribute("dominant-baseline","middle");
  tp.textContent=name.toUpperCase();
  text.appendChild(tp);
  // Starting size estimate; the real fit happens in fitNames() AFTER the tile is
  // in the visible DOM (getComputedTextLength needs layout). We tag the target
  // path length so fitNames can shrink long names to fit without clipping.
  const startFS=Math.min(150, L/Math.max(4,name.length)*1.9);
  text.setAttribute("data-fitlen", (L*0.94).toFixed(0));
  text.setAttribute("data-fs", startFS.toFixed(1));
  text.setAttribute("style",
    `font-family:var(--hand);font-weight:700;fill:var(--text);`+
    `font-size:${Math.round(startFS)}px;letter-spacing:1px;`);
  svg.appendChild(text);
}
/* After tiles are in the DOM, shrink any name that overruns its guide path so
   long names (AISHWARYA, CHANDANA, ANGAPPAN…) fit instead of getting clipped. */
function fitNames(root){
  const texts=(root||document).querySelectorAll(".tile svg text[data-fitlen]");
  texts.forEach(text=>{
    const avail=parseFloat(text.getAttribute("data-fitlen"))||0;
    let fs=parseFloat(text.getAttribute("data-fs"))||100, ls=1, guard=0;
    if(!avail) return;
    const apply=()=>text.style.cssText=
      `font-family:var(--hand);font-weight:700;fill:var(--text);`+
      `font-size:${fs.toFixed(1)}px;letter-spacing:${ls}px;`;
    let len=0; try{len=text.getComputedTextLength();}catch(e){return;}
    while(len>avail && fs>26 && guard++<40){
      fs *= avail/len * 0.99;
      if(fs<60) ls=0.3;
      apply();
      try{len=text.getComputedTextLength();}catch(e){break;}
    }
  });
}
/* Reflect a simple M/L path's x coords about width W. */
/* Reflect the x of every coordinate pair in a simple M/L path about width W.
   Handles Affinity's comma format (M1238,320L1065,1003) and space format alike. */
function flipPathX(d, W){
  const tokens=d.match(/[MLml]|-?\d*\.?\d+/g)||[];
  let out=[], i=0;
  while(i<tokens.length){
    const t=tokens[i];
    if(/[MLml]/.test(t)){
      const x=parseFloat(tokens[i+1]), y=parseFloat(tokens[i+2]);
      out.push(`${t}${(W-x).toFixed(1)},${y.toFixed(1)}`);
      i+=3;
    }else{ i++; }   // skip stray tokens
  }
  return out.join("");
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

/* ---- lightbox ------------------------------------------------------------- */
const PET={dog:"Dog person",cat:"Cat person",both:"Cats & dogs",other:"Animal person",none:"No pets"};
const VT={none:"No viz yet","1-10":"1–10 made","11-50":"11–50 made","51-100":"51–100 made","101-200":"101–200 made",lost_count:"Lost count"};
const TT={under_10km:"Under 10 km","10-25km":"10–25 km",south_india:"From South India",north_india:"From North India",outside_india:"From outside India"};
const CT={morning:"Early riser",night:"Night owl",both:"Both"};
function chips(d){const a=[d.inBangalore?"Lives in Bangalore":"From outside Bangalore"];
  if(d.pet)a.push(PET[d.pet]);if(d.viz)a.push(VT[d.viz]);if(d.travel)a.push(TT[d.travel]);
  if(d.chrono)a.push(CT[d.chrono]);
  return a.map(t=>`<span class="chip">${t}</span>`).join("");}
function ratingsLine(d){
  const r=[["Develop",d.develop],["Collect",d.collect],["Design",d.design],["Narrate",d.narrate],["Analyze",d.analyze]];
  if(r.every(x=>x[1]==null))return "";
  return '<div class="ratings">'+r.map(x=>`${x[0]} <b>${x[1]==null?"—":x[1]}</b>`).join(" · ")+"</div>";}
function openLightbox(d){
  const card=document.getElementById("lbcard");
  const note=d.notes?`<div class="note">${d.notes}</div>`:"";
  // The coded (redrawn) hand — same SVG as the grid — sits above the text on the
  // right; the original traced photo fills the left. Side-by-side once it loads.
  const codedHand=buildHand(d); codedHand.classList.add("lbhand");

  // Original photo (left). Prefer the repo-hosted copy (photos/<id>.jpg,
  // synced from the sheet by update-photos.py); fall back to the sheet's
  // remote link for ids not synced yet, then to a small inline message.
  const localPhoto=/^\d+$/.test(d.id)?`photos/${String(parseInt(d.id,10)).padStart(3,"0")}.jpg`:"";
  const photoSrc=localPhoto||d.photo, photoFb=(localPhoto&&d.photo)?d.photo:"";
  const imgWrap = photoSrc
    ? `<div class="lbimgwrap" id="lbimgwrap">
         <div class="lblabel">original</div>
         <div class="lbloading" id="lbloading">loading photo…</div>
         <img src="${photoSrc}" alt="${(d.name||'traced hand')}" id="lbimg"
              style="display:none" ${photoFb?`data-fb="${photoFb}"`:""}
              onload="this.style.display='block';var l=document.getElementById('lbloading');if(l)l.remove();"
              onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.removeAttribute('data-fb');}else{var w=document.getElementById('lbimgwrap');if(w)w.innerHTML='<div class=&quot;lblabel&quot;>original</div><div class=&quot;lbmiss&quot;>Couldn\\'t load the photo here.${d.photo?`<br><a href=&quot;${d.photo}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>open it in a new tab ↗</a>`:""}</div>';}">
       </div>`
    : `<div class="lbimgwrap"><div class="lblabel">original</div><div class="lbmiss">no photo yet</div></div>`;

  card.innerHTML=
    `<div class="lbleft">${imgWrap}</div>`+
    `<div class="lbright">`+
      `<div class="lbcoded"><div class="lblabel">coded</div><div class="lbcodedslot" id="lbcodedslot"></div></div>`+
      `<div class="lbinfo"><h2>${d.name||"Unnamed hand"}${d.uncertain?' <span style="font-size:14px;color:var(--muted)">(name uncertain)</span>':''}</h2>`+
      `<div class="sub">${d.id?"#"+d.id:""}${d.pair?" · pair":""}</div>`+
      `<div class="chips">${chips(d)}</div>`+ratingsLine(d)+note+
      `</div>`+
    `</div>`;
  card.querySelector("#lbcodedslot").appendChild(codedHand);
  document.getElementById("lb").classList.add("open");
}
function closeLb(){document.getElementById("lb").classList.remove("open");}
document.getElementById("lbclose").onclick=closeLb;
document.getElementById("lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();});

/* ---- (grid layout: no drag-scroll needed) -------------------------------- */
let dragged=false;                 // kept false; click guard below is now inert
function setupScroll(strip){ /* grid shows all tiles at once — nothing to do */ }

/* ---- render + boot -------------------------------------------------------- */
function render(rawRows,sourceLabel){
  const data=rawRows.map(normRow).filter(d=>!isHint(d)&&!isEmpty(d));
  const strip=document.getElementById("strip");strip.innerHTML="";
  for(const d of data){
    const tile=document.createElement("div");tile.className="tile"+(d.pair?" pair":"");
    tile.dataset.name=(d.name||"").toLowerCase();   // for name search
    // Deterministic "pinned to a wall" jitter, seeded by name+id so it's stable
    // across renders. Breaks the tidy catalog grid into a packed analog field:
    // slight lean, small nudge, tiny size variance — like hands traced at all
    // angles and tacked up overlapping. Mirrored (right) hands lean the other way.
    const seed=[...(d.id+"|"+d.name)].reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0);
    const rnd=(n)=>{const x=Math.sin(seed*12.9898+n*78.233)*43758.5453;return x-Math.floor(x);};
    // Weighted rotation: cube the signed unit so most hands sit near-straight and
    // only a few lean hard (like a real wall). Range ~±7° but concentrated small.
    const u=rnd(1)*2-1;
    const rot=(Math.sign(u)*Math.pow(Math.abs(u),2.2)*7).toFixed(2);
    const dx =((rnd(2)*2-1)*6).toFixed(1);              // ±6px (small; avoids overlap)
    const dy =((rnd(3)*2-1)*7).toFixed(1);              // ±7px
    const scl=(0.93+rnd(4)*0.14).toFixed(3);           // 0.93–1.07 size variance
    const z  =Math.floor(rnd(5)*10);
    tile.style.setProperty("--rot",rot+"deg");
    tile.style.setProperty("--dx",dx+"px");
    tile.style.setProperty("--dy",dy+"px");
    tile.style.setProperty("--scl",scl);
    tile.style.zIndex=z;
    const cardEl=document.createElement("div");cardEl.className="card";
    cardEl.appendChild(buildHand(d));
    tile.appendChild(cardEl);
    const nm=document.createElement("div");nm.className="nm"+(d.name?"":" unk");
    nm.textContent=(d.name||"unnamed")+(d.uncertain?" ?":"");tile.appendChild(nm);
    const h=document.createElement("div");h.className="hint";tile.appendChild(h);
    if(d.photo){tile.classList.add("clickable");h.textContent="see the original →";
      tile.addEventListener("click",()=>{if(!dragged)openLightbox(d);});}
    strip.appendChild(tile);
  }
  const withPhoto=data.filter(d=>d.photo).length;
  document.getElementById("status").textContent=`${data.length} hands · ${sourceLabel}`;
  const miss=[...MISSING];
  document.getElementById("footer").innerHTML=
    "Left hand = lives in Bangalore, right = outside. A knuckle with a dashed hollow ring "+
    "means that rating wasn't drawn on the paper; a solid dot with no arcs means a real 0. "+
    "Pentagon arcs are code placeholders until authored marker glyphs land in the SVG. "+
    (miss.length?`<br><b>Not found in SVG (to draw / rename):</b> <code>${miss.join("</code> <code>")}</code>.`:"");
  setupScroll(strip);
  // Names are in the DOM now; fit any that overrun their guide path.
  requestAnimationFrame(()=>fitNames(strip));
}

async function boot(){
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  ANCHORS=readAnchors();
  let rows=null;
  try{const r=await fetch(CSV_URL,{mode:"cors"});
    if(r.ok)rows=CSVParse(await r.text());}catch(e){rows=null;}
  if(rows&&rows.length){ render(rows,"live from the sheet"); document.getElementById("pastePanel").classList.add("hidden"); }
  else{
    // offline: use embedded sample so the scaffold always shows something
    const sample=document.getElementById("sampleCsv").textContent.trim();
    if(sample && !sample.startsWith("__")){
      const rr=CSVParse(sample);
      render(rr,"offline sample (paste your CSV to replace)");
    }else{
      document.getElementById("status").textContent="Couldn't load the sheet.";
    }
    document.getElementById("pastePanel").classList.remove("hidden");
  }
}
document.getElementById("renderBtn").onclick=()=>{
  const rows=CSVParse(document.getElementById("csvText").value);
  if(rows.length){document.getElementById("pastePanel").classList.add("hidden");render(rows,"pasted snapshot");}
};

/* ---- view modes ----------------------------------------------------------- */
function applyFitScale(){
  const strip=document.getElementById("strip");
  if(!strip.classList.contains("view-fit")) return;
  const n=strip.querySelectorAll(".tile").length; if(!n) return;
  const aspect=VB.w/VB.h;                              // tile width/height (<1, tall)
  const stripRect=strip.getBoundingClientRect();
  const availW=stripRect.width - 28;
  const availH=window.innerHeight - stripRect.top - 20;// fill down to bottom edge
  // Try every column count; keep the one that makes the LARGEST tile while all
  // rows still fit the height. That fills the viewport instead of stopping early.
  let best={cols:11, tileH:0};
  for(let cols=3; cols<=22; cols++){
    const rows=Math.ceil(n/cols);
    const colW=(availW - cols*2)/cols;
    const hByW=colW/aspect;                            // tile height if width-bound
    const hByH=(availH - rows*2)/rows;                 // tile height if height-bound
    const tileH=Math.min(hByW, hByH);                  // actual = smaller constraint
    if(tileH>best.tileH && tileH>10){ best={cols, tileH}; }
  }
  strip.style.setProperty("--fit-cols", best.cols);
  // Let rows grow to fill height: set row height so the grid spans availH.
  const rows=Math.ceil(n/best.cols);
  strip.style.setProperty("--fit-rowh", (best.tileH)+"px");
  strip.style.minHeight=availH+"px";
  strip.style.alignContent="space-between";
}
function setView(mode){
  const strip=document.getElementById("strip");
  strip.classList.remove("view-field","view-scroll","view-fit");
  strip.classList.add("view-"+mode);
  document.querySelectorAll(".vb-btn").forEach(b=>
    b.classList.toggle("active", b.dataset.view===mode));
  strip.style.removeProperty("--fit-cols");
  strip.style.removeProperty("--fit-scale");
  if(mode==="fit") applyFitScale();
  try{ localStorage; }catch(e){}
}
document.querySelectorAll(".vb-btn").forEach(b=>
  b.addEventListener("click",()=>setView(b.dataset.view)));
window.addEventListener("resize",()=>{ applyFitScale(); });

/* ---- name search --------------------------------------------------------- */
function runSearch(q){
  const strip=document.getElementById("strip");
  const count=document.getElementById("searchCount");
  const term=(q||"").trim().toLowerCase();
  const tiles=[...strip.querySelectorAll(".tile")];
  if(!term){
    strip.classList.remove("searching");
    tiles.forEach(t=>t.classList.remove("match"));
    if(count) count.textContent="";
    return;
  }
  strip.classList.add("searching");
  let hits=0, firstMatch=null;
  tiles.forEach(t=>{
    const on=(t.dataset.name||"").includes(term);
    t.classList.toggle("match", on);
    if(on){ hits++; if(!firstMatch) firstMatch=t; }
  });
  if(count) count.textContent = hits ? `${hits} found` : "no match";
  // Land on the match. In scroll mode the strip scrolls horizontally; in
  // field/fit the page scrolls vertically. Center the (first) match in whichever
  // axis applies. We always do this so a searcher's hand is brought to them.
  if(firstMatch){
    const strip=document.getElementById("strip");
    if(strip.classList.contains("view-scroll")){
      // center horizontally within the scrolling strip
      const sRect=strip.getBoundingClientRect();
      const tRect=firstMatch.getBoundingClientRect();
      const target=strip.scrollLeft + (tRect.left - sRect.left)
                   - (strip.clientWidth/2) + (tRect.width/2);
      strip.scrollTo({left:target, behavior:"smooth"});
    }else{
      // center vertically on the page (field / fit)
      firstMatch.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
    }
  }
}
const searchEl=document.getElementById("nameSearch");
if(searchEl){
  searchEl.addEventListener("input",e=>runSearch(e.target.value));
  searchEl.addEventListener("keydown",e=>{ if(e.key==="Escape"){ searchEl.value=""; runSearch(""); } });
}

boot().then(()=>setView("scroll"));
