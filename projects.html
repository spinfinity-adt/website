<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Projects — Spinfinity</title>
<link rel="stylesheet" href="/styles.css"/>
<style>
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.5rem}
.proj-card{display:flex;flex-direction:column;background:var(--card-bg);border:1px solid var(--border);border-radius:4px;overflow:hidden;text-decoration:none;color:var(--fg);transition:all .28s ease}
.proj-card:hover{border-color:var(--card-accent,var(--accent2));transform:translateY(-4px);box-shadow:0 0 0 1px var(--card-accent,var(--accent2))}
.proj-card:hover .proj-thumb img{transform:scale(1.04)}
.proj-thumb{width:100%;aspect-ratio:16/10;overflow:hidden;background:#111}
.proj-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;display:block}
.proj-body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.proj-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.2rem}
.proj-name{font-family:var(--hand);font-size:1.45rem;font-weight:700;line-height:1.1;transition:color .2s}
.proj-card:hover .proj-name{color:var(--card-accent,var(--accent2))}
.proj-desc{font-family:var(--hand);font-size:.93rem;color:var(--muted);line-height:1.55;flex:1}
.proj-link-label{font-family:var(--hand);font-size:1rem;color:var(--card-accent,var(--accent2));margin-top:.6rem;display:flex;align-items:center;gap:.3rem;transition:gap .2s}
.proj-card:hover .proj-link-label{gap:.6rem}
.proj-card.featured{grid-column:1/-1;flex-direction:row}
.proj-card.featured .proj-thumb{width:42%;flex-shrink:0;aspect-ratio:unset}
@media(max-width:640px){.proj-card.featured{flex-direction:column}.proj-card.featured .proj-thumb{width:100%;aspect-ratio:16/9}.projects-grid{grid-template-columns:1fr}}
</style>
</head>
<body class="theme-paper">

<div id="sf-nav-mount"></div>
<script src="/nav.js"></script>




<div class="page">
  <div class="container">
    <p class="section-label anim-0">the experiments</p>
            <div class="projects-grid" id="projects-grid"></div>
  </div>
</div>

<div id="sf-footer-mount"></div>


<script>
(function(){
  // ADD A PROJECT = add one object here. Fields: name, url, img, tags[], desc.
  // Optional: featured:true (large card), accent:"accent1"|"accent2"|"accent3"|"accent4" (else auto).
  const projects = [
   
    { name:"Climate Stripes", url:"https://spinfinity.in/climate-stripes", img:"images/climate-stripes.png",
      tags:["data viz","performance"], featured:true,
      desc:"A data performance turning 175 years of global temperature into a wall of colour — Ed Hawkins' climate stripes brought to life with long-exposure photography." },
    { name:"Math Creatures", url:"https://spinfinity.in/math-creatures", img:"images/math-creatures.jpg",
      tags:["education","community"], 
      desc:"Kids were asked: what does math look like to you? This gallery is their answer — hand-drawn creatures with personalities, fears, and superpowers." },

    { name:"100 Days of Making", url:"https://spinfinity.in/100-days-of-making/", img:"images/100-days-of-making.jpg",
      tags:["making","process"],
      desc:"One hundred days. One small thing made each day. A log of experiments, failures, sketches and surprises — proof that the practice matters more than the output." },

    { name:"Mosaic Data Viz", url:"https://spinfinity.in/mosaic-data-viz", img:"images/mosaic-data-viz.jpg",
      tags:["data viz","creative coding"],
      desc:"A creative coding recreation of a community data selfie — collecting and visualising people's data at Mosaic, a live community event." },

    { name:"Hilbert Curve Cat", url:"https://spinfinity.in/hilbert-curve-cat/", img:"images/hilbert-curve-cat.jpg",
      tags:["math","generative"],
      desc:"An unlimited cat generator — every cat rendered in the style of a Hilbert curve, the space-filling mathematical path that never quite repeats itself." },

    { name:"Hoop Trick Shapes", url:"https://spinfinity.in/hoop-trick-shapes/", img:"images/hoop-trick-shapes.jpg",
      tags:["education","student art"],
      desc:"Students drew the shapes they saw the hoop make after learning each trick — Barrel Roll, Cylinder, Sphere, Weave. A gallery of motion interpreted by hand." },

    { name:"Vibe Shift", url:"https://spinfinity.in/vibe-shift/", img:"images/vibe-shift.jpg",
      tags:["generative art","AI","data portrait"],
      desc:"A generative data portrait gallery made with Claude. Tell it who you are — your loves, your chaos, your aesthetics — and it translates you into a living p5.js sketch." }
  ];

  // card accent drives tag text, link label + hover name (all text) as well as the
  // hover border, so it must stay off yellow and use the AA-safe teal text variant.
  const PALETTE = ["--accent2","--accent1-text"];
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const accentOf = (p,i) => "var(" + (p.accent ? "--"+p.accent : (p.featured ? "--accent2" : PALETTE[i % PALETTE.length])) + ")";

  const grid = document.getElementById("projects-grid");
  if (grid) grid.innerHTML = projects.map((p,i) => {
    const accent = accentOf(p,i);
    const anim = "anim-" + (p.featured ? 1 : Math.min(i+1, 4));
    const tags = (p.tags||[]).map(tg => '<span class="tag" style="color:'+accent+'">'+esc(tg)+'</span>').join("");
    return '<a class="proj-card '+(p.featured?"featured ":"")+anim+'" href="'+esc(p.url)+'" style="--card-accent:'+accent+'">'
      + '<div class="proj-thumb"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy"/></div>'
      + '<div class="proj-body">'
      + '<div class="proj-tags">'+tags+'</div>'
      + '<span class="proj-name">'+esc(p.name)+'</span>'
      + '<p class="proj-desc">'+esc(p.desc)+'</p>'
      + '<span class="proj-link-label">open project →</span>'
      + '</div></a>';
  }).join("");
})();
</script>
</body>
</html>
