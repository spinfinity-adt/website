<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
    <title>generative data portraits</title>
    <link rel="stylesheet" href="/styles.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--hand);
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.6;
            padding-top: 56px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-section {
            margin-bottom: 80px;
        }

        .gallery-section h2 {
            font-family: var(--display);
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.5em;
            color: var(--text);
            font-weight: normal;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .portrait-card {
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.2s ease;
            border: 1px solid var(--border);
        }

        .portrait-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent4);
        }

        .portrait-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background: var(--bg);
            cursor: pointer;
            display: block;
        }

        .portrait-info {
            padding: 20px;
        }

        .portrait-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            gap: 10px;
        }

        .portrait-name {
            font-weight: normal;
            color: var(--text);
            font-size: 1.1em;
        }

        .event-tag {
            font-size: 0.7em;
            color: var(--accent2);
            padding: 3px 8px;
            border: 1px solid var(--accent4);
            border-radius: 3px;
            white-space: nowrap;
        }

        .portrait-prompt {
            font-size: 0.9em;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .portrait-link {
            display: inline-block;
            color: var(--text);
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .portrait-link:hover {
            background: var(--card-bg);
            border-color: var(--accent1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            overflow: auto;
        }

        .modal-content {
            background: var(--bg);
            margin: 50px auto;
            padding: 40px;
            max-width: 900px;
            border-radius: 4px;
            position: relative;
            border: 1px solid var(--border);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--text);
        }

        .modal-image {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            background: var(--bg);
            border-radius: 3px;
            margin-bottom: 25px;
        }

        .modal-info h3 {
            margin-bottom: 8px;
            color: var(--text);
            font-weight: normal;
            font-size: 1.3em;
        }

        .modal-event {
            font-size: 0.85em;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .modal-prompt {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 3px;
            line-height: 1.7;
            color: var(--muted);
            white-space: pre-wrap;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent4);
        }

        .modal-link {
            display: inline-block;
            background: var(--card-bg);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 1em;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .modal-link:hover {
            background: var(--border);
            border-color: var(--accent1);
        }

        .empty-gallery {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
            font-size: 1.1em;
        }

        a {
            color: inherit;
        }
    </style>
</head>

<body class="theme-studio">
    <div id="sf-nav-mount"></div>
    <script src="/nav.js"></script>
    <div class="container">
        <header class="proj-header">
            <h1>generative data portraits</h1>
            <p class="proj-sub">made with p5.js and claude</p>
        </header>

        <div class="gallery-section">
            <h2>gallery wall 🖼️</h2>
            <div class="gallery-grid" id="gallery-grid"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <img class="modal-image" id="modal-image" src="" alt="">
            <div class="modal-info">
                <h3 id="modal-name"></h3>
                <div class="modal-event" id="modal-event"></div>
                <div class="modal-prompt" id="modal-prompt"></div>
                <a id="modal-link" class="modal-link" href="" target="_blank">view live code →</a>
            </div>
        </div>
    </div>

    <script>
        // Static gallery — exported from the Supabase `portraits` table on 2026-07-10,
        // newest first. The live Supabase + Cloudinary upload flow (and the submission
        // form) was removed in the same commit as this data; `git revert` that commit
        // to bring uploads back with an active Supabase project.
        const portraits = [
            {
                name: "Hokusai ramen cat fan",
                p5js_link: "https://editor.p5js.org/spinfinity.in/sketches/tYK1M3Fxg",
                prompt: "Create a generative data portrait in p5.js for me. \n\nI [love tea, Ramen, and cats].\n\n On the [chaos/order] scale, I feel 43% [chaotic] today. Make this a slider I can adjust \n\nTake inspiration from Hokusai. Let the form be metaphorical and inspired by his great wave painting\n\nGive me code I can paste directly into the p5.js editor. Canvas 600x600, no external libraries.",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1773228819/cuw70od5lypxn2gvko7i.gif",
                event: "example"
            },
            {
                name: "jagrut",
                p5js_link: "https://editor.p5js.org/movelike.jags/sketches/cpxyMtUsW",
                prompt: "Create a generative data portrait in p5.js for me.\n\nI love spirals and nature, fractals and natural intelligence. I was a national level swimmer and I love trekking and cycling. Im 27 years old and I love sunrises and cold water. Im a teacher and an origami artist. I love driving my car and helping the people I love. I get jealous and envious and I lie sometimes. I also want the entire structure to be 3d and rotate. Also add elements of H. R. Giger\n\nOn the order/chaos scale, I feel 50 % [chaotic] today.\n\nTake inspiration from [MC Escher and Ernst Haeckel ]. Let the form be [abstract and naturalist]",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771423120/e69k61mldcfsoywz97w0.gif",
                event: "vibe shift"
            },
            {
                name: "mohit",
                p5js_link: "https://editor.p5js.org/axsdjkghalskdjfgh/sketches/KAYetGuQn",
                prompt: "i need you to make a generative portrait using p5js for me -- i like cats, i like post rock and idm, i like the art of brakhage, schiele, klimt, and i want my portrait to be breathing, organic, sun-kist, green, reminiscent of tam-dao by diptyque, and for the movement aspects i'd like you to incorporate some organic leaf growth behaviour, add some generative music effects with the blossoming of the leaves",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771331850/zphajomsns4ghihcf4jx.png",
                event: "vibe shift"
            },
            {
                name: "Anonymous",
                p5js_link: "https://editor.p5js.org/aditya222behera/full/a0_9eCeT7",
                prompt: "Create a generative data portrait in p5.js for me.\n\nI love cars and driving on empty roads, pixelated art, neon themed things. \n\nOn the chaos scale I feel 18% today.\n\nTake inspiration from 90's sci-fi movie posters. Let the form be image reveal.\n\nGive me code I can paste directly into the p5.js editor Canvas 600x600, no external libraries.\n\nadd a forest on the sides of the road where all the trees are neon-themed and lit up. add sign boards here and there among the trees. add a way to save the gif the animation creates.",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771331675/pzj8lx8mk9xwswmr0ejz.gif",
                event: "vibe shift"
            },
            {
                name: "Nico",
                p5js_link: "https://editor.p5js.org/NiharikaHari/sketches/jgK27WHOk",
                prompt: "I want to make a digital self portrait for a generate data portrait workshop. Rn i'm obsessed with sudoku, i love giving up, im always tired, i love coding and 3d printing and crocheting . I want something weird that feels like me, that involves movement, and adds some kind of control through a slider. Take inspiration from absurdist art. Focus on the generative art aspect. Lean into the sudoku vibes. don't use a human face. Make it 3d, and that I can drag to look at the artwork from different angles. give me code i can paste directly into the p5.js editor. Canvas 600x600, no external libraries.",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771331456/yoydojizmfyh6iv0pfcu.gif",
                event: "vibe shift"
            },
            {
                name: "Saksham",
                p5js_link: "https://editor.p5js.org/1sakshm/full/4L5wYLv9j",
                prompt: "i need to generate a chaos self portrait for myself in p5.js, i need a generative data portrait, i would love to\n  see how you generate and simulate the abstraction between life and death, i wanna see what people feel in the\n  place between life and death personally. i love sunshine and thunder + chaos. i am an extrovert who loves\n  talking. i feel 80% chaotic today and ive lived in 6 different cities. give me the code i can paste directly into\n   p5.js editor. canvas 600x600. no external libraries.",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771331425/e03yd3gunr9mz4dyhdgp.gif",
                event: "vibe shift"
            },
            {
                name: "Netsu :)",
                p5js_link: "https://editor.p5js.org/https.netra/sketches/fKUwPWfoz",
                prompt: "generative data portrait in p5.js for me. i love pink, books, my family and friends. i am an ambivert. someone who  overthinks a lot. generate something in the form of impressionism painting that reveals itself slowly. give me a code i can paste directly into the p5.js editor. canvas 400*400, no external libraries.",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771331381/qvnmklt48bjgwiqb8yze.jpg",
                event: "vibe shift"
            },
            {
                name: "spinfinity.adt",
                p5js_link: "https://editor.p5js.org/spinfinity.in/sketches/kdorGxLdV",
                prompt: "Create a hula hoop themed generative portrait in p5.js for me. I love flow arts, cats and math. Canvas 600x600, no external libraries. give me code that I can paste into p5.js. add an option to save as gif and image using the saveGif function",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771311792/rwlkcduxij0564o7xehg.gif",
                event: "example"
            },
            {
                name: "Bangalorean Bharatnatyam Dancer",
                p5js_link: "https://editor.p5js.org/spinfinity.in/sketches/1ElK9yMc_",
                prompt: "Create a generative data portrait in p5.js for me.\n\nI [love Bangalore, I love filter coffee, I love the intersection of science and art whatever feels relevant].\n\nOn the [chaos/order] scale, I feel 67%% [chaotic] today.\n\nI have lived in 4 cities.\nTake inspiration from Bharatnatyam aesthetics.\n\nGive me code I can paste directly into the p5.js editor. Canvas 600x600, no external libraries.",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771311214/n9os9idglkm3slocrsmn.gif",
                event: "example"
            },
            {
                name: "Aditi",
                p5js_link: "https://editor.p5js.org/spinfinity.in/sketches/aVxvfs1eT",
                prompt: "Create a typography poem generative portrait in p5js. A poem text in spiral form/lines that reveals an image",
                image_url: "https://res.cloudinary.com/dygkrkgni/image/upload/v1771305297/kwwrn9jowgyerh1joypu.gif",
                event: "example"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => renderGallery(portraits));

        function renderGallery(portraits) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            portraits.forEach((portrait) => {
                const card = document.createElement('div');
                card.className = 'portrait-card';

                const img = document.createElement('img');
                img.className = 'portrait-image';
                img.src = portrait.image_url;
                img.alt = `portrait by ${portrait.name}`;
                img.onclick = () => openModal(portrait);

                const info = document.createElement('div');
                info.className = 'portrait-info';

                const header = document.createElement('div');
                header.className = 'portrait-header';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'portrait-name';
                nameDiv.textContent = portrait.name;

                header.appendChild(nameDiv);

                // Add event tag if event exists
                if (portrait.event) {
                    const eventTag = document.createElement('div');
                    eventTag.className = 'event-tag';
                    eventTag.textContent = portrait.event;
                    header.appendChild(eventTag);
                }

                const promptDiv = document.createElement('div');
                promptDiv.className = 'portrait-prompt';
                promptDiv.textContent = portrait.prompt;

                const link = document.createElement('a');
                link.className = 'portrait-link';
                link.href = portrait.p5js_link;
                link.target = '_blank';
                link.textContent = 'view code →';

                info.appendChild(header);
                info.appendChild(promptDiv);
                info.appendChild(link);

                card.appendChild(img);
                card.appendChild(info);
                grid.appendChild(card);
            });
        }

        function openModal(portrait) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modal-image');
            const modalName = document.getElementById('modal-name');
            const modalEvent = document.getElementById('modal-event');
            const modalPrompt = document.getElementById('modal-prompt');
            const modalLink = document.getElementById('modal-link');

            modalImage.src = portrait.image_url;
            modalName.textContent = portrait.name;
            modalEvent.textContent = portrait.event || '';
            modalEvent.style.display = portrait.event ? 'block' : 'none';
            modalPrompt.textContent = portrait.prompt;
            modalLink.href = portrait.p5js_link;

            modal.style.display = 'block';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
        }

        document.getElementById('close-modal').onclick = closeModal;

        window.onclick = (event) => {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Make functions available globally
        window.openModal = openModal;
        window.closeModal = closeModal;
    </script>
</body>

</html>
