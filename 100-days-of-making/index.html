function getGroup(machine) {
  const m = machine.toLowerCase();
  const parts = m.split(",").map(s => s.trim());
  const found = new Set();
  for (const pt of parts) {
    if (["p5js","dataviz","claude"].some(k => pt.includes(k)))                          found.add("Creative Coding");
    else if (["canva","slides"].some(k => pt.includes(k)))                              found.add("Digital");
    else if (["laser"].some(k => pt.includes(k)))                                       found.add("Laser Cutter");
    else if (["vinyl","plotter"].some(k => pt.includes(k)))                             found.add("Vinyl Cutter");
    else if (["scroll saw"].some(k => pt.includes(k)))                                  found.add("Woodworking");
    else if (["3d printer","3d pen"].some(k => pt.includes(k)))                         found.add("3D Printing");
    else if (["origami","paper bag","pop up","zine","paper"].some(k => pt.includes(k))) found.add("Paper");
    else if (["light up"].some(k => pt.includes(k)))                                    found.add("Electronics");
    else if (["hand drawn"].some(k => pt.includes(k)))                                  found.add("Analog Art");
    else found.add("Digital");
  }
  for (const g of ["Creative Coding","Digital","Laser Cutter","Vinyl Cutter","Woodworking","3D Printing","Paper","Electronics","Analog Art"]) {
    if (found.has(g)) return g;
  }
  return "Digital";
}

// ── P5 SKETCH ─────────────────────────────────────────────────────────────────
new p5(function(p) {

  const isMobile = window.innerWidth < 700;

  // On mobile: fill screen width, no legend column
  // On desktop: use min(90vw, 860px) with legend
  const SZ    = isMobile ? window.innerWidth : Math.min(window.innerWidth * 0.92, 860);
  const GTOP  = isMobile ? 58 : 82;
  const LGND  = isMobile ? 0  : 190;
  const PAD   = isMobile ? 14 : 52;
  const COLS  = 10;
  const ROWS  = 10;
  const GRIDW = SZ - PAD * 2 - LGND;
  const GRIDH = SZ - GTOP - (isMobile ? 20 : 36);
  const CELLW = GRIDW / COLS;
  const CELLH = GRIDH / ROWS;
  const R     = Math.min(CELLW, CELLH) * 0.33;
  const INK   = '#2a2520';

  const tooltip = document.getElementById('tooltip');

  function getXY(i) {
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    return {
      cx: PAD + col * CELLW + CELLW / 2,
      cy: GTOP + row * CELLH + CELLH / 2,
    };
  }

  function wNoise(seed, ang, amt) {
    return 1 + (p.noise(seed + p.cos(ang) * 0.5, p.sin(ang) * 0.5 + seed * 0.07) - 0.5) * amt;
  }

  // ── SHAPES ────────────────────────────────────────────────────────────────────
  function shapeAditi(cx, cy, r, seed) {
    p.beginShape();
    const pts = 6;
    for (let i = 0; i <= pts + 5; i++) {
      const t = (i % pts) / pts;
      const ang = t * p.TWO_PI - p.HALF_PI;
      const w = wNoise(seed, ang, 0.09);
      p.curveVertex(cx + p.cos(ang) * r * 0.88 * w, cy + p.sin(ang) * r * 0.88 * w);
    }
    p.endShape(p.CLOSE);
  }

  function shapeMathura(cx, cy, r, seed) {
    p.beginShape();
    const pts = 4;
    for (let i = 0; i <= pts + 5; i++) {
      const t = (i % pts) / pts;
      const ang = t * p.TWO_PI - p.PI / 4;
      const w = wNoise(seed, ang, 0.1);
      const cornerPush = 1 + 0.18 * Math.pow(Math.abs(p.cos(ang * 2)), 3);
      p.curveVertex(cx + p.cos(ang) * r * w * cornerPush, cy + p.sin(ang) * r * w * cornerPush);
    }
    p.endShape(p.CLOSE);
  }

  function shapeSakshi(cx, cy, r, seed) {
    p.beginShape();
    const pts = 3;
    for (let i = 0; i <= pts + 2; i++) {
      const t = (i % pts) / pts;
      const ang = t * p.TWO_PI - p.HALF_PI;
      const w = wNoise(seed, ang, 0.09);
      const roundness = 1 + 0.22 * (1 - Math.abs(p.cos(ang * 1.5)));
      p.curveVertex(cx + p.cos(ang) * r * w * roundness, cy + p.sin(ang) * r * w * roundness);
    }
    p.endShape(p.CLOSE);
  }

  function drawCatEars(cx, cy, r, fillColor, seed) {
    const earH  = r * 0.85;
    const earW  = r * 0.62;
    const earCX = r * 0.35;
    const earTY = cy - r * 0.82;
    function jit(v, s) { return v + (p.noise(seed + s) - 0.5) * r * 0.1; }
    for (const side of [-1, 1]) {
      const ex = cx + side * earCX;
      p.fill(fillColor);
      p.beginShape();
      p.vertex(jit(ex - earW * 0.7, 1.1),         jit(earTY + earH * 0.55, 1.2));
      p.vertex(jit(ex + earW * 0.7, 1.3),         jit(earTY + earH * 0.55, 1.4));
      p.vertex(jit(ex + side * earW * 0.55, 1.5), jit(earTY - earH * 0.45, 1.6));
      p.endShape(p.CLOSE);
    }
  }

  function drawNode(cx, cy, r, maker, isCat, fillColor, seed) {
    p.noStroke();
    if (isCat) drawCatEars(cx, cy, r, fillColor, seed + 99);
    p.fill(fillColor);
    p.noStroke();
    if (maker === "Aditi")        shapeAditi(cx, cy, r, seed);
    else if (maker === "Mathura") shapeMathura(cx, cy, r, seed);
    else                          shapeSakshi(cx, cy, r, seed);
  }

  function getStreakPairs() {
    const pairs = [];
    for (let i = 0; i < 99; i++) {
      const colA = i % COLS;
      const colB = (i + 1) % COLS;
      if (colB < colA) continue;
      if (days[i].maker === days[i + 1].maker) pairs.push(i);
    }
    return pairs;
  }

  function dayAtPos(mx, my) {
    for (let i = 0; i < 100; i++) {
      const {cx, cy} = getXY(i);
      if (p.dist(mx, my, cx, cy) < R + 8) return i;
    }
    return null;
  }

  // ── FILTER STATE ─────────────────────────────────────────────────────────────
  let filterMedium = null;
  let filterMaker  = null;
  let filterCat    = false;
  let filterTheme  = null;  // "Hilbert Curve" / "Tessellation" / "Fractal" or null

  const legendHits = [];
  let pclHit = null; // bounding box of "PCL" in title

  function isVisible(day) {
    if (filterCat    && !day.isCat)                        return false;
    if (filterMedium && day.group !== filterMedium)        return false;
    if (filterMaker  && day.maker !== filterMaker)         return false;
    if (filterTheme  && !day.themes.includes(filterTheme)) return false;
    return true;
  }

  function clearFilters() {
    filterMedium = null; filterMaker = null; filterCat = false; filterTheme = null;
  }

  function legendAtPos(mx, my) {
    for (const h of legendHits) {
      if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) return h;
    }
    return null;
  }

  p.setup = function() {
    const cnv = p.createCanvas(SZ, SZ);
    cnv.parent('canvas-container');
    p.noLoop();

    document.fonts.ready.then(() => {
      p.textFont('Open Sans');
      p.redraw();
    });

    // Expose redraw for mobile legend taps
    window._p5redraw = () => p.redraw();

    function getCanvasPos(e) {
      const rect = cnv.canvas.getBoundingClientRect();
      const src  = e.touches ? e.touches[0] : e;
      return {
        mx: (src.clientX - rect.left) * (SZ / rect.width),
        my: (src.clientY - rect.top)  * (SZ / rect.height),
      };
    }

    cnv.canvas.addEventListener('mousemove', e => {
      const {mx, my} = getCanvasPos(e);
      const idx = dayAtPos(mx, my);
      const leg = !isMobile ? legendAtPos(mx, my) : null;
      const onPcl = pclHit && mx >= pclHit.x && mx <= pclHit.x + pclHit.w && my >= pclHit.y && my <= pclHit.y + pclHit.h;
      if (idx !== null) {
        const d = days[idx];
        tooltip.style.display = 'block';
        tooltip.style.left    = (e.clientX + 14) + 'px';
        tooltip.style.top     = (e.clientY - 10) + 'px';
        tooltip.innerHTML     = `<strong>Day ${d.d}</strong> · ${d.maker}<br>${d.thing}<br><em style="opacity:0.6">${d.machine}</em>`;
        cnv.canvas.style.cursor = LINKS[idx] ? 'pointer' : 'default';
      } else if (leg || onPcl) {
        tooltip.style.display = 'none';
        cnv.canvas.style.cursor = 'pointer';
      } else {
        tooltip.style.display = 'none';
        cnv.canvas.style.cursor = 'default';
      }
    });

    cnv.canvas.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      cnv.canvas.style.cursor = 'default';
    });

    function handleTap(e) {
      const {mx, my} = getCanvasPos(e);

      // Check PCL title link
      if (pclHit && mx >= pclHit.x && mx <= pclHit.x + pclHit.w && my >= pclHit.y && my <= pclHit.y + pclHit.h) {
        window.open('https://papercranelab.com', '_blank');
        return;
      }

      // Check legend first
      if (!isMobile) {
        const leg = legendAtPos(mx, my);
        if (leg) {
          if (leg.type === 'medium') {
            filterMedium = (filterMedium === leg.value) ? null : leg.value;
            filterMaker = null; filterCat = false; filterTheme = null;
          } else if (leg.type === 'maker') {
            filterMaker = (filterMaker === leg.value) ? null : leg.value;
            filterMedium = null; filterCat = false; filterTheme = null;
          } else if (leg.type === 'cat') {
            filterCat = !filterCat;
            filterMedium = null; filterMaker = null; filterTheme = null;
          } else if (leg.type === 'theme') {
            filterTheme = (filterTheme === leg.value) ? null : leg.value;
            filterMedium = null; filterMaker = null; filterCat = false;
          } else if (leg.type === 'clear') {
            clearFilters();
          }
          p.redraw();
          return;
        }
      }

      // Then check nodes — only open Instagram if not filtered out
      const idx = dayAtPos(mx, my);
      if (idx !== null && LINKS[idx] && isVisible(days[idx])) {
        window.open(LINKS[idx], '_blank');
      }
    }
    cnv.canvas.addEventListener('click', handleTap);
    cnv.canvas.addEventListener('touchstart', handleTap, {passive: true});
  };

  p.draw = function() {
    p.randomSeed(42);
    p.noiseSeed(17);

    // Background
    p.background('#f2ede3');
    p.noStroke();
    for (let i = 0; i < 1000; i++) {
      p.fill(0, 0, 0, p.random(3, 13));
      p.ellipse(p.random(SZ), p.random(SZ), p.random(0.4, 2.2));
    }

    // ── Title ─────────────────────────────────────────────────────────────────
    const titleY = isMobile ? 10 : 12;

    if (isMobile) {
      p.noStroke(); p.fill(INK);
      p.textFont('Fraunces'); p.textSize(18);
      p.textAlign(p.LEFT, p.BASELINE);
      p.text("100 days of making at PCL", PAD, titleY + 18);
      p.textFont('Open Sans'); p.textSize(9); p.fill(160);
      p.textStyle(p.ITALIC);
      p.textAlign(p.LEFT, p.TOP);
      p.text("Dec 3, 2025 – Mar 12, 2026  ·  Aditi, Mathura & Sakshi", PAD, titleY + 28);
      p.textStyle(p.NORMAL);
    } else {
      p.noStroke(); p.fill(INK);
      p.textFont('Fraunces'); p.textSize(40);
      p.textAlign(p.LEFT, p.BASELINE);
      p.text("100 days of making at PCL", PAD, titleY + 40);

      // Record PCL hit box — measure where "PCL" sits within the title string
      const prefixW = p.textWidth("100 days of making at ");
      const pclW    = p.textWidth("PCL");
      pclHit = { x: PAD + prefixW, y: titleY, w: pclW, h: 44 };

      // Thin rule
      const titleW = p.textWidth("100 days of making at PCL");
      p.stroke(200); p.strokeWeight(0.8);
      p.line(PAD, titleY + 47, PAD + titleW, titleY + 47);
      p.noStroke();

      // Date line
      p.textFont('Open Sans'); p.textStyle(p.ITALIC); p.textSize(11); p.fill(165);
      p.textAlign(p.LEFT, p.TOP);
      p.text("December 3, 2025 – March 12, 2026  ·  Aditi, Mathura & Sakshi", PAD, titleY + 53);
      p.textStyle(p.NORMAL);
    }

    // Streak lines
    const streakPairs = getStreakPairs();
    for (const i of streakPairs) {
      const a = getXY(i);
      const b = getXY(i + 1);
      p.stroke(180, 172, 160, 160);
      p.strokeWeight(1.3);
      p.noFill();
      p.beginShape();
      for (let s = 0; s <= 6; s++) {
        const t  = s / 6;
        const ix = p.lerp(a.cx, b.cx, t);
        const iy = p.lerp(a.cy, b.cy, t);
        p.curveVertex(
          ix + (p.noise(ix * 0.04 + i * 0.3, t * 2) - 0.5) * 5,
          iy + (p.noise(ix * 0.04, iy * 0.04 + i * 0.3 + 5) - 0.5) * 5
        );
      }
      p.endShape();
    }

    // Nodes
    const anyFilter = filterMedium || filterMaker || filterCat || filterTheme;
    for (let i = 0; i < 100; i++) {
      const day  = days[i];
      const {cx, cy} = getXY(i);
      const col  = MAT[day.group];
      const seed = i * 4.13 + 2.7;
      p.randomSeed(i * 23 + 7);
      p.noiseSeed(i * 13 + 5);

      const visible = isVisible(day);
      if (anyFilter && !visible) {
        // Dimmed — draw with low opacity grey
        p.drawingContext.globalAlpha = 0.13;
      }
      drawNode(cx, cy, R, day.maker, day.isCat, col, seed);
      // Use light number on dark backgrounds
      const darkGroups = new Set(["Vinyl Cutter","Woodworking"]);
      const numCol = darkGroups.has(day.group) ? '#f2ede3' : INK;
      p.noStroke(); p.fill(numCol);
      p.textStyle(p.NORMAL);
      p.textSize(isMobile ? 6 : 8);
      p.textAlign(p.CENTER, p.CENTER);
      p.text(day.d, cx, cy + 1);
      p.drawingContext.globalAlpha = 1.0;
    }

    // Desktop legend only
    if (!isMobile) {
      legendHits.length = 0; // reset each draw
      const lx = SZ - LGND + 12;
      let   ly = GTOP + 4;
      const lR = 10;
      const rowH = 22;

      p.randomSeed(900); p.noiseSeed(900);

      // ── Section: medium ──
      p.noStroke(); p.fill(INK); p.textSize(13); p.textStyle(p.BOLD);
      p.textAlign(p.LEFT, p.TOP);
      p.text("medium", lx, ly); p.textStyle(p.NORMAL);
      ly += 18;

      const matRows = [
        ["Creative Coding","Creative Coding"],
        ["Digital","Digital"],
        ["Laser Cutter","Laser Cutter"],
        ["Vinyl Cutter","Sitalakshmi the Vinyl Cutter"],
        ["Woodworking","Woodworking"],
        ["3D Printing","SaviTHREE the 3D Printer"],
        ["Paper","Paper"],
        ["Electronics","Electronics"],
        ["Analog Art","Analog Art"],
      ];
      matRows.forEach(([grp, label], gi) => {
        const isActive = filterMedium === grp;
        const count = days.filter(d => d.group === grp).length;
        p.randomSeed(900 + gi * 9); p.noiseSeed(900 + gi * 7);

        // Active highlight pill
        if (isActive) {
          p.noStroke(); p.fill(INK);
          p.rect(lx - 4, ly - 1, LGND - 16, rowH - 2, 4);
        }

        const dotCol = isActive ? '#f2ede3' : MAT[grp];
        p.fill(dotCol); p.noStroke();
        const ns = 900 + gi * 4;
        p.beginShape();
        for (let k = 0; k <= 16; k++) {
          const a = (k / 14) * p.TWO_PI;
          const w = 1 + (p.noise(ns + p.cos(a)*0.4, p.sin(a)*0.4) - 0.5) * 0.13;
          p.curveVertex(lx + 9 + p.cos(a) * lR * w, ly + 9 + p.sin(a) * lR * w);
        }
        p.endShape(p.CLOSE);

        p.noStroke();
        p.fill(isActive ? '#f2ede3' : INK);
        p.textSize(10); p.textAlign(p.LEFT, p.TOP);
        p.text(label, lx + 23, ly + 4);

        // Count — right-aligned, only when active
        if (isActive) {
          p.textAlign(p.RIGHT, p.TOP);
          p.fill('#f2ede3'); p.textSize(10);
          p.text(count, lx + LGND - 24, ly + 4);
          p.textAlign(p.LEFT, p.TOP);
        }

        legendHits.push({type:'medium', value:grp, x:lx-4, y:ly-1, w:LGND-16, h:rowH-2});
        ly += rowH;
      });

      ly += 10;

      // ── Section: maker ──
      p.noStroke(); p.fill(INK); p.textSize(13); p.textStyle(p.BOLD);
      p.textAlign(p.LEFT, p.TOP);
      p.text("maker", lx, ly); p.textStyle(p.NORMAL);
      ly += 18;

      [["Aditi"],["Mathura"],["Sakshi"]].forEach(([name], mi) => {
        const isActive = filterMaker === name;
        const count = days.filter(d => d.maker === name).length;
        p.randomSeed(800 + mi * 11); p.noiseSeed(800 + mi * 7);

        if (isActive) {
          p.noStroke(); p.fill(INK);
          p.rect(lx - 4, ly - 1, LGND - 16, rowH - 2, 4);
        }

        const shapeCol = isActive ? '#f2ede3' : '#b8b0a4';
        p.fill(shapeCol); p.noStroke();
        const lns = 800 + mi * 5;
        const lcy = ly + 9, lcx = lx + 9;
        if (name === "Aditi")        shapeAditi(lcx, lcy, lR, lns);
        else if (name === "Mathura") shapeMathura(lcx, lcy, lR, lns);
        else                         shapeSakshi(lcx, lcy, lR, lns);

        p.noStroke(); p.fill(isActive ? '#f2ede3' : INK);
        p.textSize(11); p.textAlign(p.LEFT, p.TOP);
        p.text(name, lx + 23, ly + 4);

        if (isActive) {
          p.textAlign(p.RIGHT, p.TOP);
          p.fill('#f2ede3'); p.textSize(10);
          p.text(count, lx + LGND - 24, ly + 4);
          p.textAlign(p.LEFT, p.TOP);
        }

        legendHits.push({type:'maker', value:name, x:lx-4, y:ly-1, w:LGND-16, h:rowH-2});
        ly += rowH;
      });

      ly += 10;

      // ── Section: cat day ──
      p.noStroke(); p.fill(INK); p.textSize(13); p.textStyle(p.BOLD);
      p.textAlign(p.LEFT, p.TOP);
      p.text("cat day", lx, ly); p.textStyle(p.NORMAL);
      ly += 18;

      const catActive = filterCat;
      const catCount = days.filter(d => d.isCat).length;
      if (catActive) {
        p.noStroke(); p.fill(INK);
        p.rect(lx - 4, ly - 1, LGND - 16, rowH - 2, 4);
      }
      p.randomSeed(700); p.noiseSeed(700);
      const catCol = catActive ? '#f2ede3' : '#b8b0a4';
      p.fill(catCol); p.noStroke();
      drawCatEars(lx + 9, ly + 10, lR, catCol, 700);
      shapeAditi(lx + 9, ly + 10, lR, 700);
      p.noStroke(); p.fill(catActive ? '#f2ede3' : 110);
      p.textSize(10); p.textAlign(p.LEFT, p.TOP);
      p.text("ears behind the shape", lx + 23, ly + 4);
      if (catActive) {
        p.textAlign(p.RIGHT, p.TOP);
        p.fill('#f2ede3'); p.textSize(10);
        p.text(catCount, lx + LGND - 24, ly + 4);
        p.textAlign(p.LEFT, p.TOP);
      }
      legendHits.push({type:'cat', value:true, x:lx-4, y:ly-1, w:LGND-16, h:rowH-2});
      ly += rowH;

      ly += 10;

      // ── Section: theme ──
      p.noStroke(); p.fill(INK); p.textSize(13); p.textStyle(p.BOLD);
      p.textAlign(p.LEFT, p.TOP);
      p.text("series", lx, ly); p.textStyle(p.NORMAL);
      ly += 18;

      const themeRows = [
        ["Hilbert Curve",        "〰"],
        ["Tiling",               "⬡"],
        ["Puzzle",               "🧩"],
        ["Origami Tessellation", "✦"],
        ["Hooping Cat",          "🐱"],
      ];
      themeRows.forEach(([theme, icon], ti) => {
        const isActive = filterTheme === theme;
        const count = days.filter(d => d.themes.includes(theme)).length;

        if (isActive) {
          p.noStroke(); p.fill(INK);
          p.rect(lx - 4, ly - 1, LGND - 16, rowH - 2, 4);
        }

        p.noStroke(); p.fill(isActive ? '#f2ede3' : INK);
        p.textSize(11); p.textAlign(p.LEFT, p.TOP);
        p.text(`${icon}  ${theme}`, lx + 4, ly + 4);

        if (isActive) {
          p.textAlign(p.RIGHT, p.TOP);
          p.fill('#f2ede3'); p.textSize(10);
          p.text(count, lx + LGND - 24, ly + 4);
          p.textAlign(p.LEFT, p.TOP);
        }

        legendHits.push({type:'theme', value:theme, x:lx-4, y:ly-1, w:LGND-16, h:rowH-2});
        ly += rowH;
      });

      // Clear filter hint
      if (filterMedium || filterMaker || filterCat || filterTheme) {
        ly += 8;
        legendHits.push({type:'clear', value:null, x:lx-4, y:ly-1, w:LGND-16, h:18});
        p.noStroke(); p.fill(200); p.textSize(9.5);
        p.textAlign(p.LEFT, p.TOP);
        p.text("✕ clear filter", lx + 2, ly + 2);
        ly += 20;
      }

      ly += 12;

      // ── Streak ──
      p.noStroke(); p.fill(INK); p.textSize(13); p.textStyle(p.BOLD);
      p.text("streak", lx, ly); p.textStyle(p.NORMAL);
      ly += 17;
      p.stroke(180, 172, 160, 180); p.strokeWeight(1.5);
      p.line(lx, ly + 6, lx + 38, ly + 6);
      p.noStroke(); p.fill(110); p.textSize(10);
      p.text("same maker, consecutive days", lx, ly + 14);
      ly += 32;

      // ── Reading direction ──
      p.noStroke(); p.fill(150); p.textSize(9.5); p.textStyle(p.NORMAL);
      p.text("left → right, top → bottom\n(days 1 → 100)", lx, ly);

      // Hint at bottom
      p.noStroke(); p.fill(170); p.textSize(9);
      p.textAlign(p.CENTER, p.BOTTOM);
      p.text("hover · click legend to filter · click shape to open instagram", SZ/2 - LGND/2, SZ - 6);
    } else {
      // Mobile hint at bottom of canvas
      p.noStroke(); p.fill(160); p.textSize(8);
      p.textAlign(p.CENTER, p.BOTTOM);
      p.text("tap shape to open on instagram · filter below", SZ / 2, SZ - 5);
    }
  };

}, document.getElementById('canvas-container'));
</script>
</body>
</html>
