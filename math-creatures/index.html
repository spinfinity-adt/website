<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Creatures — Spinfinity</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Card accents cycle through the four brand colours (theme-paper tokens).
       Yellow is frame/tint only — never text (site palette rule). */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { color: var(--text); min-height: 100vh; overflow-x: hidden; }
    header { max-width: 1400px; margin: 0 auto; padding: 2rem 40px 0.5rem; }
    header h1 { font-family: var(--display); font-weight: 700; font-size: 2rem; line-height: 1.05; color: var(--text); margin: 0; }
    header h1 span { font-family: var(--hand); font-weight: 800; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent1-text); display: block; margin-bottom: 5px; }
    .note-tile { break-inside: avoid; display: inline-block; width: 100%; margin-bottom: 20px; }
    .note-tile-inner {
      background: var(--card-bg); border: 2px solid var(--accent4); border-radius: 16px;
      padding: 20px 18px 16px; box-shadow: 0 4px 0 rgba(130,103,190,0.22);
    }
    .note-body { font-family: var(--hand); font-size: .92rem; line-height: 1.6; color: var(--text); }
    .note-body p + p { margin-top: .7em; }
    .note-body strong { font-weight: 800; }
    .note-body em { font-style: italic; color: var(--accent2); }
    .note-sig { font-family: var(--hand); font-size: .82rem; font-weight: 700; color: var(--muted); margin-top: 12px; }
    .filters-area {
      padding: 28px 40px 12px; max-width: 1400px; margin: 0 auto;
      display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    }
    .filter-label { font-family: var(--hand); font-size: 1rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn {
      font-family: var(--hand); font-weight: 700; font-size: .9rem; padding: 5px 16px;
      border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--card-bg); color: var(--muted); cursor: pointer; transition: all 0.15s ease;
    }
    .filter-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .filter-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    .status-line {
      padding: 4px 40px 0; max-width: 1400px; margin: 0 auto;
      font-family: var(--hand); font-size: 0.9rem; color: var(--muted); min-height: 22px;
    }
    .grid { column-count: 4; column-gap: 20px; padding: 24px 40px 80px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 1100px) { .grid { column-count: 3; } }
    @media (max-width: 760px)  { .grid { column-count: 2; padding: 20px 20px 60px; } }
    @media (max-width: 480px)  { .grid { column-count: 1; } }
    @media (max-width: 600px)  { .intro { padding: 40px 20px 36px; } .filters-area { padding: 20px; } .status-line { padding-left: 20px; } }
    .card {
      break-inside: avoid; display: inline-block; width: 100%; margin-bottom: 20px;
      position: relative; cursor: pointer; animation: fadeUp 0.35s ease both;
    }
    .card.hidden { display: none; }
    .card-inner {
      background: var(--card-bg); border: 2px solid var(--edge); border-radius: 16px;
      padding: 10px 10px 14px; box-shadow: 0 4px 0 var(--edge-soft);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover .card-inner { transform: translateY(-4px); box-shadow: 0 8px 0 var(--edge-soft); }
    /* one of the four brand accents per card */
    .grid > :nth-child(4n+1) .card-inner, .grid > :nth-child(4n+1) { --edge:#3FA796; --edge-soft:rgba(63,167,150,0.24);  --tint:rgba(63,167,150,0.10); }
    .grid > :nth-child(4n+2) .card-inner, .grid > :nth-child(4n+2) { --edge:#8267BE; --edge-soft:rgba(130,103,190,0.24); --tint:rgba(130,103,190,0.10); }
    .grid > :nth-child(4n+3) .card-inner, .grid > :nth-child(4n+3) { --edge:#FFBD35; --edge-soft:rgba(255,189,53,0.30);  --tint:rgba(255,189,53,0.14); }
    .grid > :nth-child(4n+4) .card-inner, .grid > :nth-child(4n+4) { --edge:#502064; --edge-soft:rgba(80,32,100,0.22);   --tint:rgba(80,32,100,0.08); }
    .card-img { width: 100%; display: block; border-radius: 10px; background: var(--tint); padding: 8px; }
    .card-body { padding: 10px 4px 2px; }
    .card-name { font-family: var(--display); font-size: 1.25rem; font-weight: 700; color: var(--text); line-height: 1.15; margin-bottom: 3px; }
    .card-meta { font-family: var(--hand); font-size: 0.72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .card-emotion-tag {
      display: inline-block; font-family: var(--hand); font-size: 0.78rem; font-weight: 700;
      padding: 2px 10px; border-radius: 10px; background: var(--tint);
      color: var(--text); margin-bottom: 6px;
    }
    .card-description { font-size: 0.82rem; line-height: 1.65; color: var(--text); display: none; margin-top: 6px; }
    .card-questions { margin-top: 8px; display: none; }
    .questions-label { font-family: var(--hand); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }
    .question-item { font-family: var(--hand); font-size: 0.92rem; font-weight: 600; color: var(--accent2); line-height: 1.5; border-left: 2px solid var(--accent2); padding-left: 8px; margin-bottom: 3px; }
    .expand-btn {
      display: block; width: 100%; text-align: center; font-family: var(--hand); font-weight: 700;
      font-size: 0.82rem; color: var(--muted); background: none; border: none; cursor: pointer;
      padding: 7px 0 2px; margin-top: 8px; border-top: 1px dashed var(--border); transition: color 0.15s;
    }
    .expand-btn:hover { color: var(--accent2); }
    .card.expanded .card-description, .card.expanded .card-questions { display: block; }
    .lightbox {
      display: none; position: fixed; inset: 0; background: rgba(35,39,48,0.6);
      z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px);
    }
    .lightbox.open { display: flex; }
    .lightbox-content {
      background: var(--card-bg); border-radius: 16px; max-width: 820px; width: 100%;
      max-height: 90vh; overflow-y: auto; display: flex;
      box-shadow: 0 24px 70px rgba(35,39,48,0.35); position: relative;
    }
    .lb-img-side { width: 48%; flex-shrink: 0; background: rgba(63,167,150,0.08); display: flex; align-items: center; justify-content: center; padding: 24px; }
    .lb-img-side img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; }
    .lb-text-side { padding: 36px 30px 30px; flex: 1; overflow-y: auto; }
    .lb-name { font-family: var(--display); font-size: 2rem; font-weight: 700; color: var(--text); line-height: 1.1; margin-bottom: 4px; }
    .lb-meta { font-family: var(--hand); font-size: 0.8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
    .lb-description { font-size: 0.9rem; line-height: 1.8; color: var(--text); }
    .lb-questions { margin-top: 18px; padding: 14px 16px; background: rgba(80,32,100,0.06); border-radius: 10px; border-left: 3px solid var(--accent2); }
    .lb-questions .questions-label { margin-bottom: 8px; }
    .lb-q-item { font-family: var(--hand); font-size: 1.05rem; font-weight: 600; color: var(--accent2); line-height: 1.55; margin-bottom: 4px; }
    .lb-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .lb-tag { font-family: var(--hand); font-size: 0.82rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; background: rgba(130,103,190,0.10); color: var(--text); }
    .lb-close { position: absolute; top: 12px; right: 14px; background: none; border: none; font-family: var(--hand); font-size: 1.6rem; cursor: pointer; color: var(--muted); line-height: 1; z-index: 10; }
    .lb-close:hover { color: var(--text); }
    @media (max-width: 620px) { .lightbox-content { flex-direction: column; } .lb-img-side { width: 100%; max-height: 45vh; } }
    .loading-state { text-align: center; padding: 80px 40px; font-family: var(--hand); font-size: 1.2rem; color: var(--muted); }
    .loading-state .dot { display: inline-block; animation: blink 1.2s infinite; }
    .loading-state .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-state .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; } }
    .footer { text-align: center; padding: 0 40px 60px; font-family: var(--hand); font-size: 1rem; color: var(--muted); line-height: 1.8; }
    .footer a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSI6LsxxrOjecL2-xYydl_MTemNjImNNzS5rKcKRhwMKU5UjZs9r2LJv0zLElB3eQfhr20cT8O13vcy/pub?output=csv&gid=0";

const FALLBACK = [
  {file:"MathCreature_Refuge_1",name:"Maria",center:"Refuge",standard:"6th",gender:"F",description:"This is the only mildly positive drawing from the Refuge group. She\u2019s drawn a cute little girl and written, \u201cyou are very interesting.\u201d She\u2019s visualized her math person as a girl made of shapes. You can see triangles and other elements of math, very mildly.",emotion:"Neutral, mildly positive",form:"made of shapes",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_1.png"},
  {file:"MathCreature_Refuge_2",name:"Maths Man",center:"Refuge",standard:"9th",gender:"F",description:"She starts by writing an acronym for math: \u201cMental Attack to Hyper students.\u201d Then she says, \u201cI\u2019m not gonna let you go away from me.\u201d Her math human has shapes built into the body \u2014 a triangle for a nose, pencils for hands, and squares for eyes. Next to it, she\u2019s written, \u201cyou actually look great and cute.\u201d",emotion:"Aggressive, threatening, anger",form:"made of shapes",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_2.png"},
  {file:"MathCreature_Refuge_3",name:"Itachi",center:"Refuge",standard:"10th",gender:"F",description:"This math person is called Itachi. The math person is made up of shapes: a triangular cone for a hat, a face drawn with this emoji :-|, circles for feet, and rectangles for the rest of the body.\n\nThe conversation is very aggressive. It says, \u201cWhy the hell did you find math, Itachi?\u201d She also asks, \u201cIs your home built with numbers, Itachi?\u201d At the end, she writes, \u201cMy mood just goes off because of you, Itachi, because of this math.\u201d",emotion:"aggressive, mood off, existential",form:"made of shapes",questions:"Why the hell did you find math? | Is your home built with numbers?",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_3.png"},
  {file:"MathCreature_Refuge_5",name:"Killer",center:"Refuge",standard:"8th",gender:"F",description:"This math person is named Killer. It has Xs for eyes, an equal sign for a mouth, 3s for ears, a conical hat, and a body made of rectangles. The second half of the image has huge letters: \u201cWHY did you come into this world?\u201d The tone is very aggressive and direct.",emotion:"anger, rage, aggressive, direct, existential",form:"literal, made of shapes, made of numbers",questions:"WHY did you come into this world?",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_5.png"},
  {file:"MathCreature_Refuge_6",name:"torture killer",center:"Refuge",standard:"8th",gender:"F",description:"This math creature is called Torture Killer. It has a 1 for a nose. Parts of the body are colored green: the cap, the hands, a belt, and the shoes. There\u2019s \u201c8288\u201d written on the shirt.\n\nShe\u2019s written a letter to Maths: \u201cDear Maths, Hello. Who created you? Because of you, I got scolding from when I was 6 years old, means from 1st standard to 8th standard. Get out of this world. Don\u2019t think that after this people die next generation. I will come next generation also. Don\u2019t ever come back, The next generation\u2019s children will suffer. Yours sincerely, Park Eren.\u201d",emotion:"anger, rage, aggressive, direct, threatening, humiliation, scolded",form:"literal, made of numbers, humanlike, oppressive",questions:"Who created you?",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_6.png"},
  {file:"MathCreature_Refuge_7",name:"numb",center:"Refuge",standard:"8th",gender:"F",description:"This math person is called Numb, because numbers make her feel numb. She\u2019s used 1s for the hair, squares with dots inside for the eyes, and a triangle for the nose. Numb\u2019s shirt is covered in numbers 1 to 16, and the pants filled with numbers 19 to 50.\n\nShe\u2019s also drawn herself next to Numb and named herself Jasmine. Above Jasmine\u2019s head are multiplication tables, and her face looks sad and confused.\n\nJasmine is asking Numb: \u201cWho are you? Why are you created? Why did they keep your name as Maths? In the world, many students hate you. Do you have feelings? Do you cry? You are a very difficult subject for many students. I\u2019m going mad when I learn.\u201d",emotion:"existential, empathetic, going mad",form:"metaphorical, detailed, made of numbers, made of shapes, punny",questions:"Who are you? Why are you created? | Why did they keep your name as Maths? | In the world, many students hate you. Do you have feelings? Do you cry?",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_7.png"},
  {file:"MathCreature_Refuge_8",name:"mary chacko",center:"Refuge",standard:"9th",gender:"F",description:"This math person is named Mary Chacko, which is the student\u2019s math teacher. The face is a clock, and the rest of the body is made of numbers.\n\nOn the side, there\u2019s only one question: \u201cWho is your father?\u201d",emotion:"questioning authority, existential",form:"made of shapes, made of numbers",questions:"Who is your father?",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_8.png"},
  {file:"MathCreature_Refuge_9",name:"Chiyaan",center:"Refuge",standard:"7th",gender:"F",description:"This math creature is named Chiyaan. The face is a square. The eyes are made of sixes, the eyebrows are lines, and an X is used for the mouth. The torso is a single line, with eights for arms and nines for legs.\n\nThis one has only one question: \u201cWhy are you created?\u201d",emotion:"existential",form:"made of numbers, stick figure, made of shapes",questions:"Why are you created?",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_9.png"},
  {file:"MathCreature_Refuge_10",name:"Mr. Math (R.D. Sharma)",center:"Refuge",standard:"2nd year B. Comm.",gender:"F",description:"This one is written by a volunteer in her second year of college. The math person is named Mr. Math (RD Sharma). The character wears a hat. The face is a smiling cube, the torso is a cone, and the lower body is an inverted cone.\n\nIt says, \u201cI\u2019m smiling because tears of kids make me happy.\u201d",emotion:"evil, questioning authority",form:"made of shapes",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_Refuge_10.png"},
  {file:"MathCreature_RGH_1",name:"Chota Bheem",center:"RGH",standard:"4th",gender:"M",description:"Asif imagines math as Chota Bheem holding a bag of laddus. There\u2019s also something on the side that looks like a launcher. Asif has written: \u201cBheem is putting glass because he\u2019s math\u2019s teacher.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_1.png"},
  {file:"MathCreature_RGH_2",name:"Joker",center:"RGH",standard:"4th",gender:"",description:"A clown who is juggling balls with motion trails behind them.",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_2.png"},
  {file:"MathCreature_RGH_3",name:"Asim's Math Tree",center:"RGH",standard:"4th",gender:"M",description:"A math tree with symbols like plus signs, multiplication signs, division signs, and minus signs arranged in a triangular pattern in the leaves. The tree trunk has a smiling face and two separate hands with leaves, making it look like a humanoid tree.",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_3.png"},
  {file:"MathCreature_RGH_4",name:"Math Apple",center:"RGH",standard:"4th",gender:"M",description:"A math apple with square eyes and the word \u201cmath\u201d written below them. Around the apple are multiplication, division, plus and minus signs.\n\nThe child wrote: \u201cHe is boy, he is a smart person and the math is taking a class. The apple math is crying because I ate math apple half. It is so sad and the student is laughing.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_4.png"},
  {file:"MathCreature_RGH_5",name:"Harshita's Math Tree",center:"RGH",standard:"4th",gender:"F",description:"Harshita\u2019s math tree. Instead of fruits, the leaves contain symbols and numbers. On the trunk there is an evil smiling face. Below the leaves, two additional branches act like hands reaching outward, almost as if the tree is coming to get you.",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_5.png"},
  {file:"MathCreature_RGH_7",name:"Sun Teacher",center:"RGH",standard:"4th",gender:"",description:"A sun that\u2019s teaching math. It\u2019s wearing glasses and holding a sheet with math symbols, smiling and sweating. Behind it is a blackboard with equations including long division and a BODMAS equation.",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_7.png"},
  {file:"MathCreature_RGH_8",name:"Math Cat",center:"RGH",standard:"4th",gender:"F",description:"A cat made entirely of mathematical shapes. The face is a circle, the ears are triangles, the eyes are circles, the nose is a triangle, and the mouth is an oval. The torso and arms are rectangles.",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_8.png"},
  {file:"MathCreature_RGH_9",name:"Ravi",center:"RGH",standard:"4th",gender:"",description:"A creature called Ravi with a cap shaped like a whistle. An arrow pointing right says \u201caddition,\u201d and an arrow pointing left says \u201csubtraction.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_9.png"},
  {file:"MathCreature_RGH_10",name:"Rocky",center:"RGH",standard:"4th",gender:"F",description:"A robot-like creature with a circular face and two antennae. The torso is a square, the arms are rectangles with spheres for hands. The text says \u201cit is look like boy and smart.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_10.png"},
  {file:"MathCreature_RGH_12",name:"Shabnam's Math Robot",center:"RGH",standard:"4th",gender:"F",description:"A robot with two antennae and an oval-ish face with a smiling mouth. Square torso with circles for buttons, rectangular limbs, rounded arms, and rectangular feet. The text says, \u201cIt look like boy and smart.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_12.png"},
  {file:"MathCreature_RGH_13",name:"Yamraj",center:"RGH",standard:"4th",gender:"",description:"A ghost-like creature holding a scythe, like a grim reaper. Behind it are smaller versions which look like bodyguards. The text says, \u201cMy name is Yamraj.\u201d (Yamraj is the god of death in Hindu culture.)",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_13.png"},
  {file:"MathCreature_RGH_14",name:"King",center:"RGH",standard:"4th",gender:"M",description:"A creature called King with a square head, Xs for eyes, a division sign for a nose, and a curved mouth with teeth. The text reads, \u201cThis is a boy. He look very smart. Her name is King. King is a mathmatics.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_14.png"},
  {file:"MathCreature_RGH_15",name:"Hema's Math Tree",center:"RGH",standard:"4th",gender:"F",description:"A tree with math symbols among the leaves. The trunk has a playful face with a smiling expression, visible eyelashes and eyebrows, and a tongue sticking out.",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_15.png"},
  {file:"MathCreature_RGH_16",name:"Harry",center:"RGH",standard:"4th",gender:"F",description:"A creature named Harry with a playful smile and Xs for ears. A circle for the torso, rectangles for limbs, and circles for the hands and feet. The text says, \u201cit look like boy and good.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_16.png"},
  {file:"MathCreature_RGH_17",name:"Pradeep's Math Face",center:"RGH",standard:"4th",gender:"M",description:"Just the face of a creature. The eyes are division signs, the nose is a 1, and the face is formed using a minus sign.\n\nThe child wrote: \u201cFirst division is so bad because the sum is so long. Next one is we will demand tables. And then three, then subtraction can do the maths and we can count.\u201d",emotion:"",form:"",questions:"",image:"https://raw.githubusercontent.com/spinfinity-adt/math-creatures/main/trimmed/MathCreature_RGH_17.png"}
];

// ── CSV PARSER ──
// Parses character-by-character so quoted multiline fields (long descriptions
// with real newlines) never get split incorrectly.
function parseCSV(text) {
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  const rows = [];
  let row = [], field = '', inQ = false, i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (inQ) {
      if (ch === '"' && src[i+1] === '"') { field += '"'; i += 2; }
      else if (ch === '"')                { inQ = false; i++; }
      else                                { field += ch; i++; }
    } else {
      if      (ch === '"')  { inQ = true; i++; }
      else if (ch === ',')  { row.push(field.trim()); field = ''; i++; }
      else if (ch === '\n') { row.push(field.trim()); rows.push(row); row = []; field = ''; i++; }
      else                  { field += ch; i++; }
    }
  }
  row.push(field.trim());
  if (row.some(f => f !== '')) rows.push(row);

  if (rows.length < 2) return [];

  const headers = rows[0];
  const idx = n => headers.indexOf(n);
  const COL = {
    file: idx('File Name'), name: idx('Math creature name'), center: idx('Learning Center'),
    standard: idx('Standard'), gender: idx('Gender'), description: idx('Description/Alt Text'),
    emotion: idx('emotion'), form: idx('form'), questions: idx('Questions'), image: idx('Link to image'),
  };

  return rows.slice(1).map(r => {
    const name = COL.name >= 0 ? (r[COL.name] || '').trim() : '';
    if (!name) return null;
    const get = k => COL[k] >= 0 ? (r[COL[k]] || '') : '';
    return { file: get('file'), name, center: get('center'), standard: get('standard'),
             gender: get('gender'), description: get('description'), emotion: get('emotion'),
             form: get('form'), questions: get('questions'), image: get('image') };
  }).filter(Boolean);
}

// ── BUILD CARD ──
function buildCard(c, i) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.center = c.center;
  card.dataset.hasQuestions = c.questions ? 'true' : 'false';
  card.style.animationDelay = Math.min(i * 35, 700) + 'ms';

  const displayName = c.name.replace(/(^|\s)\w/g, l => l.toUpperCase());
  const metaParts = [c.center, c.standard ? 'Std. ' + c.standard : null].filter(Boolean);
  const questions = c.questions ? c.questions.split('|').map(q => q.trim()).filter(Boolean) : [];

  card.innerHTML =
    '<div class="card-inner">' +
    (c.image ? '<img class="card-img" src="' + c.image + '" alt="' + displayName + '" loading="lazy">' : '') +
    '<div class="card-body">' +
    '<div class="card-name">' + displayName + '</div>' +
    '<div class="card-meta">' + metaParts.join(' \u00b7 ') + '</div>' +
    (c.emotion ? '<div class="card-emotion-tag">' + c.emotion + '</div>' : '') +
    (c.description ? '<div class="card-description">' + c.description.replace(/\n/g, '<br><br>') + '</div>' : '') +
    (questions.length ? '<div class="card-questions"><div class="questions-label">asked math \u2014</div>' +
      questions.map(q => '<div class="question-item">' + q + '</div>').join('') + '</div>' : '') +
    '<button class="expand-btn">read more \u2193</button>' +
    '</div></div>';

  card.querySelector('.expand-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    var expanded = card.classList.toggle('expanded');
    e.target.textContent = expanded ? 'show less \u2191' : 'read more \u2193';
  });
  card.querySelector('.card-inner').addEventListener('click', function() { openLightbox(c); });
  return card;
}

// ── RENDER ──
function buildNote() {
  var n = document.createElement('div');
  n.className = 'note-tile';
  n.innerHTML = '<div class="note-tile-inner">' +
    '<div class="note-body">' +
    '<p>I asked my students to <em>imagine Math as a person or living being</em> \u2014 and to draw it, name it, and ask it whatever they wanted.</p>' +
    '<p>These math creatures were made by <strong>bold, brilliant girls aged 9\u201314</strong> at an orphanage where the math trauma is almost generational \u2014 and by <strong>4th standard students</strong> at a government school.</p>' +
    '<p>Learning math is an incredibly emotional experience. In our education system, being good at math means you are smart, and being bad at math means you\'re not. Over time, these labels shape how children see themselves.</p>' +
    '<p>Spinfinity is about breaking out of these labels, and exploring math through the body. We use hula hoops as a tool to play and spin math concepts.</p>' +
    '</div>' +
    '<div class="note-sig">\u2014 <strong>Aditi Bhat</strong>, Chief Spinner at Spinfinity</div>' +
    '</div>';
  return n;
}
function renderGrid(data) {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!data.length) { grid.innerHTML = '<div class="loading-state">no creatures found</div>'; return; }
  grid.appendChild(buildNote());
  data.forEach(function(c, i) { grid.appendChild(buildCard(c, i)); });
  updateCount();
}

function updateCount() {
  var visible = document.querySelectorAll('.card:not(.hidden)').length;
  document.getElementById('statusLine').textContent = visible + ' creature' + (visible !== 1 ? 's' : '');
}

// ── FILTERS ──
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    var filter = btn.dataset.filter;
    document.querySelectorAll('.card').forEach(function(card) {
      var visible = true;
      if      (filter === 'center:Refuge')    visible = card.dataset.center === 'Refuge';
      else if (filter === 'center:RGH')       visible = card.dataset.center === 'RGH';
      else if (filter === 'has-questions')    visible = card.dataset.hasQuestions === 'true';
      card.classList.toggle('hidden', !visible);
    });
    updateCount();
  });
});

// ── LIGHTBOX ──
function openLightbox(c) {
  var displayName = c.name.replace(/(^|\s)\w/g, function(l) { return l.toUpperCase(); });
  var metaParts = [c.center, c.standard ? 'Std. ' + c.standard : null].filter(Boolean);
  var questions = c.questions ? c.questions.split('|').map(function(q) { return q.trim(); }).filter(Boolean) : [];

  document.getElementById('lbImg').src = c.image || '';
  document.getElementById('lbImg').alt = displayName;
  document.getElementById('lbName').textContent = displayName;
  document.getElementById('lbMeta').textContent = metaParts.join(' \u00b7 ');
  document.getElementById('lbDesc').innerHTML = (c.description || '').replace(/\n/g, '<br><br>');

  document.getElementById('lbQuestions').innerHTML = questions.length
    ? '<div class="lb-questions"><span class="questions-label">asked math \u2014</span>' +
      questions.map(function(q) { return '<div class="lb-q-item">' + q + '</div>'; }).join('') + '</div>'
    : '';

  var tags = [c.emotion, c.form].filter(Boolean);
  document.getElementById('lbTags').innerHTML = tags.map(function(t) { return '<span class="lb-tag">' + t + '</span>'; }).join('');

  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target === document.getElementById('lightbox')) closeLightbox(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

// ── INIT ──
// Uses localStorage to cache last-good sheet data — loads instantly on repeat visits.
async function init() {
  // Show cached data immediately if we have it
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('mathCreaturesData')); } catch(e) {}
  if (cached && cached.length) {
    renderGrid(cached);
  }

  // Then try to fetch fresh data in background
  try {
    var res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var text = await res.text();
    var data = parseCSV(text);
    if (data.length === 0) throw new Error('empty');
    localStorage.setItem('mathCreaturesData', JSON.stringify(data));
    renderGrid(data);
  } catch(err) {
    console.warn('Sheet fetch failed:', err);
    if (!cached || !cached.length) {
      renderGrid(FALLBACK);
    }
  }
}

init();
</script>
