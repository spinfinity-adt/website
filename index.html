.hero{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:clamp(2rem,5vw,4rem);min-height:calc(100vh - var(--nav-h));padding:clamp(2rem,6vw,5rem) clamp(1.2rem,5vw,3.5rem) 3rem}
.hero-text{display:flex;flex-direction:column;justify-content:center;gap:1.8rem;max-width:700px}
.hero-media{position:relative;width:100%;aspect-ratio:1;justify-self:stretch;overflow:hidden}
.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:1000px){
  /* the video takes the right half of the screen, bled to the edges */
  .hero{grid-template-columns:minmax(0,1fr);padding-right:calc(50vw + clamp(1.5rem,3vw,3rem))}
  .hero-media{position:absolute;top:0;right:0;width:50vw;height:100%;aspect-ratio:auto}
}
.logo-area{position:relative;display:inline-block;align-self:flex-start}
.logo{font-family:var(--hand);font-size:clamp(2.6rem,10vw,6rem);font-weight:700;line-height:.88;color:var(--fg);white-space:nowrap}
.logo .inf{color:var(--accent2)}
.logo-area::after{content:'';display:block;height:5px;margin-top:.5rem;background:linear-gradient(90deg,var(--accent2),var(--accent3));border-radius:10px;transform:rotate(-1.2deg) scaleX(0);transform-origin:left;animation:underline-draw .9s cubic-bezier(.16,1,.3,1) .4s forwards;box-shadow:0 0 12px rgba(63,167,150,.5)}
.tagline{font-family:var(--hand);font-size:clamp(1.1rem,3vw,1.8rem);line-height:1.55;max-width:520px;font-weight:400}
.tagline .math{color:var(--accent2);font-style:italic}

.hero-cta{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.cta-btn{font-family:var(--hand);font-size:1.1rem;font-weight:700;text-decoration:none;padding:.55rem 1.4rem;border-radius:2px;transition:all .22s ease}
.cta-primary{background:var(--accent2);color:var(--bg)}
.cta-primary:hover{transform:translateY(-2px) scale(1.03)}
.cta-ghost{color:var(--fg);border:2px solid rgba(255,255,255,.18)}
.cta-ghost:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-2px)}
@media(max-width:480px){
  .hero-cta{gap:.7rem}
  .cta-btn{font-size:1rem;padding:.5rem 1.1rem}
}

<script>
/* hero video: starts at 1s and loops back to 1s, so the first second
   never shows. Muted + playsinline is what lets browsers autoplay it.

   Play only once the seek has landed ('seeked'): setting currentTime
   and calling play() back to back races, and the video starts from 0. */
(function(){
  var v = document.getElementById('hero-video');
  if (!v) return;
  var START = 1;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fromStart(){
    v.addEventListener('seeked', function go(){
      v.removeEventListener('seeked', go);
      if (!still) v.play().catch(function(){});   /* autoplay refused: the 1s frame stays up */
    });
    v.currentTime = START;
  }

  /* metadata may already be in by the time this runs */
  if (v.readyState >= 1) fromStart();
  else v.addEventListener('loadedmetadata', fromStart, { once: true });

  v.addEventListener('ended', fromStart);
})();
</script>
