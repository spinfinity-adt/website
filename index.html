<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinfinity</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080f;
      --fg: #eeeaf8;
      --accent1: #ff6b35;
      --accent2: #3de8ff;
      --accent3: #c97fff;
      --glow1: rgba(61, 232, 255, 0.18);
      --glow2: rgba(201, 127, 255, 0.14);
      --muted: #3a3a52;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Instrument Serif', serif;
      overflow-x: hidden;
    }

    /* ---- CANVAS SPIRAL BG ---- */
    #spiral-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.55;
    }

    /* Dark vignette so content stays readable */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, transparent 20%, rgba(7,8,15,0.7) 70%, rgba(7,8,15,0.95) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.5;
    }

    .wrap {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2rem, 6vw, 5rem);
      max-width: 860px;
      margin: 0 auto;
    }

    /* ---- HERO ---- */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.8rem;
      padding-top: 6vh;
    }

    .logo-area {
      position: relative;
      display: inline-block;
      align-self: flex-start;
    }

    .logo {
      font-family: 'Caveat', cursive;
      font-size: clamp(3.8rem, 13vw, 8.5rem);
      font-weight: 700;
      line-height: 0.88;
      color: var(--fg);
      letter-spacing: -0.01em;
      text-shadow: 0 0 60px rgba(61,232,255,0.2), 0 0 120px rgba(201,127,255,0.1);
    }

    .logo .inf {
      color: var(--accent2);
      text-shadow: 0 0 30px rgba(61,232,255,0.6), 0 0 80px rgba(61,232,255,0.3);
    }

    .logo-area::after {
      content: '';
      display: block;
      height: 5px;
      margin-top: 0.5rem;
      background: linear-gradient(90deg, var(--accent2), var(--accent3));
      border-radius: 10px;
      transform: rotate(-1.2deg) scaleX(0);
      transform-origin: left;
      animation: underline-draw 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      box-shadow: 0 0 12px rgba(61,232,255,0.5);
    }

    @keyframes underline-draw {
      to { transform: rotate(-1.2deg) scaleX(1); }
    }

    .tagline {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      color: var(--fg);
      font-weight: 400;
      opacity: 0;
      transform: translateY(14px);
      animation: fade-up 0.7s ease 0.9s forwards;
      max-width: 500px;
      line-height: 1.45;
    }

    .tagline .math {
      color: var(--accent2);
      font-style: italic;
    }

    .tagline .hoop {
      color: var(--accent3);
    }

    /* ---- DIVIDER ---- */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      animation: fade-up 0.5s ease 1.1s forwards;
    }

    .divider span {
      font-family: 'Caveat', cursive;
      font-size: 0.95rem;
      color: var(--muted);
      white-space: nowrap;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--muted), transparent);
    }

    /* ---- PROJECTS ---- */
    .projects {
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fade-up 0.6s ease 1.25s forwards;
    }

    .project-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      text-decoration: none;
      color: var(--fg);
      transition: all 0.25s ease;
      position: relative;
    }

    .project-link:first-child { border-top: 1px dashed rgba(255,255,255,0.08); }

    .project-num {
      font-family: 'Caveat', cursive;
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 2ch;
      transition: color 0.2s;
    }

    .project-name {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 600;
      transition: all 0.25s ease;
      flex: 1;
    }

    .project-arrow {
      font-size: 1.1rem;
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.25s ease;
    }

    .project-link:hover .project-arrow { opacity: 1; transform: translateX(0); }

    .project-link:nth-child(1):hover .project-name {
      color: var(--accent2);
      text-shadow: 0 0 20px rgba(61,232,255,0.4);
    }
    .project-link:nth-child(1):hover .project-num { color: var(--accent2); }

    .project-link:nth-child(2):hover .project-name {
      color: var(--accent3);
      text-shadow: 0 0 20px rgba(201,127,255,0.4);
    }
    .project-link:nth-child(2):hover .project-num { color: var(--accent3); }

    .project-link:nth-child(3):hover .project-name {
      color: var(--accent1);
      text-shadow: 0 0 20px rgba(255,107,53,0.4);
    }
    .project-link:nth-child(3):hover .project-num { color: var(--accent1); }

    /* ---- FOOTER / SOCIALS ---- */
    footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 2.5rem 0 0.5rem;
      opacity: 0;
      animation: fade-up 0.5s ease 1.5s forwards;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .footer-note {
      font-family: 'Caveat', cursive;
      font-size: 0.95rem;
      color: var(--muted);
      font-style: italic;
    }

    .socials {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-link {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      padding: 0.45rem 1.1rem;
      border-radius: 2px;
      transition: all 0.2s ease;
      letter-spacing: 0.04em;
      position: relative;
    }

    .social-link.insta {
      color: var(--accent3);
      border: 2px solid var(--accent3);
      box-shadow: 0 0 0 rgba(201,127,255,0);
    }

    .social-link.insta:hover {
      background: var(--accent3);
      color: var(--bg);
      box-shadow: 0 0 20px rgba(201,127,255,0.5), 0 0 40px rgba(201,127,255,0.2);
      transform: rotate(-1deg) scale(1.04);
    }

    .social-link.sub {
      color: var(--accent2);
      border: 2px solid var(--accent2);
      box-shadow: 0 0 0 rgba(61,232,255,0);
    }

    .social-link.sub:hover {
      background: var(--accent2);
      color: var(--bg);
      box-shadow: 0 0 20px rgba(61,232,255,0.5), 0 0 40px rgba(61,232,255,0.2);
      transform: rotate(1deg) scale(1.04);
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="spiral-canvas"></canvas>

  <div class="wrap">
    <main class="hero">
      <div class="logo-area">
        <h1 class="logo">spin<span class="inf">finity</span></h1>
      </div>

      <p class="tagline">
        tracing <span class="math">equations</span> in the air,<br>
        <span class="hoop">the hoop keeps spinning,</span> the site is catching up.<br>
        stay tuned!
      </p>

      <div class="divider">
        <span>live experiments</span>
      </div>

      <nav class="projects">
        <a class="project-link" href="/hilbert-curve-cat">
          <span class="project-num">01</span>
          <span class="project-name">hilbert-curve-cat</span>
          <span class="project-arrow">→</span>
        </a>
        <a class="project-link" href="/mosaic-data-viz">
          <span class="project-num">02</span>
          <span class="project-name">mosaic-data-viz</span>
          <span class="project-arrow">→</span>
        </a>
        <a class="project-link" href="/vibe-shift">
          <span class="project-num">03</span>
          <span class="project-name">vibe-shift</span>
          <span class="project-arrow">→</span>
        </a>
      </nav>
    </main>

    <footer>
      <span class="footer-note">© spinfinity — by Aditi Bhat</span>
      <div class="socials">
        <a class="social-link insta" href="https://instagram.com/spinfinity.adt" target="_blank" rel="noopener">instagram</a>
        <a class="social-link sub" href="https://spinfinity.substack.com" target="_blank" rel="noopener">substack</a>
      </div>
    </footer>
  </div>

  <script>
    // Animated glowing spiral trails — inspired by LED hoop long-exposure photos
    const canvas = document.getElementById('spiral-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, t = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Define several spiral "threads" with different params
    const threads = [
      { a: 180, b: 160, kx: 3, ky: 2, phase: 0,      color: [61, 232, 255],   weight: 1.4, speed: 0.004 },
      { a: 220, b: 190, kx: 5, ky: 4, phase: 0.6,     color: [201, 127, 255],  weight: 1.1, speed: 0.003 },
      { a: 140, b: 140, kx: 4, ky: 3, phase: 1.2,     color: [255, 107, 53],   weight: 0.9, speed: 0.005 },
      { a: 260, b: 230, kx: 7, ky: 6, phase: 0.3,     color: [61, 232, 255],   weight: 0.7, speed: 0.0025 },
      { a: 100, b: 120, kx: 2, ky: 3, phase: 2.1,     color: [255, 220, 100],  weight: 0.8, speed: 0.006 },
    ];

    const STEPS = 700;

    function drawThread(th, globalT) {
      const cx = W * 0.68;
      const cy = H * 0.5;
      const [r, g, b] = th.color;
      ctx.beginPath();

      for (let i = 0; i <= STEPS; i++) {
        const angle = (i / STEPS) * Math.PI * 2;
        // Lissajous-style but with a slowly rotating phase to animate
        const px = cx + th.a * Math.sin(th.kx * angle + globalT * th.speed * 1000 + th.phase);
        const py = cy + th.b * Math.sin(th.ky * angle + th.phase * 1.3);

        // Fade alpha along the path for a trail feel
        const alpha = 0.12 + 0.25 * Math.pow(Math.sin(angle * 0.5), 2);
        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }

      ctx.strokeStyle = `rgba(${r},${g},${b},0.55)`;
      ctx.lineWidth = th.weight;
      ctx.shadowColor = `rgba(${r},${g},${b},0.8)`;
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawSecondaryGlow(th, globalT) {
      // Thicker outer glow pass
      const cx = W * 0.68;
      const cy = H * 0.5;
      const [r, g, b] = th.color;
      ctx.beginPath();
      for (let i = 0; i <= STEPS; i++) {
        const angle = (i / STEPS) * Math.PI * 2;
        const px = cx + th.a * Math.sin(th.kx * angle + globalT * th.speed * 1000 + th.phase);
        const py = cy + th.b * Math.sin(th.ky * angle + th.phase * 1.3);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(${r},${g},${b},0.08)`;
      ctx.lineWidth = th.weight * 6;
      ctx.shadowColor = `rgba(${r},${g},${b},0.3)`;
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    let lastTime = 0;
    function animate(ts) {
      const dt = ts - lastTime;
      lastTime = ts;
      t += dt * 0.001;

      ctx.clearRect(0, 0, W, H);

      // Draw glow passes first, then sharp lines on top
      for (const th of threads) drawSecondaryGlow(th, t);
      for (const th of threads) drawThread(th, t);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
