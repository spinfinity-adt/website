<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
/* ============================================================
   hoop cat — a stranger's cat from cataas.com, read as data and
   redrawn in truchet tiles. A truchet tile is two quarter-arcs:
   two fragments of a hoop. So the portrait is made of hoops and
   nothing else.

   The encoding: each tile samples the light at its centre, then
   the tiles are split at their own quartiles into four steps —
   dark to light: deep purple, lilac, teal, yellow. Binning by
   quantile rather than by a fixed scale means a sunlit white cat
   and a black cat in a basement both come back using the whole
   palette, instead of flattening into one colour. Darker also
   draws heavier, so tone survives the quantisation. Every colour
   comes from the theme tokens in styles.css; nothing is hardcoded.

   The portrait is a disc, not a square — a hoop-shaped portal with
   a cat in it. Tiles land in order of distance from the centre, so
   it blooms outward the way a hoop opens up, then settles and stops.
   ============================================================ */
(function(){
  var holder = document.getElementById('truchet-cat');
  var again  = document.getElementById('cat-again');
  if (!holder || typeof p5 === 'undefined') return;

  var CAT   = 'https://cataas.com/cat?width=480&height=480';
  var TILE  = 14;
  var STEPS = ['--accent2','--accent4','--accent1','--accent3']; /* dark -> light */
  var MIN = 196, MAX = 448;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  new p5(function(p){
    var src = null, buf = null, side = 0, queue = [], cursor = 0, raf = null;

    function token(name){
      return getComputedStyle(document.body).getPropertyValue(name).trim();
    }

    /* the block's width is set by the grid column, never by what is
       inside it, so measuring it can't feed back into the canvas */
    function measure(){
      var w = holder.getBoundingClientRect().width;
      if (!w) return 0;
      return Math.max(MIN, Math.min(Math.floor(w / TILE) * TILE, MAX));
    }

    /* downsample the full-res original into an offscreen buffer:
       always from the original, so repeated resizes never compound
       the loss, and at density 1 so pixels index 1:1 with tiles */
    function rescale(){
      if (!src || !side) return;
      if (!buf || buf.width !== side){
        if (buf) buf.remove();
        buf = p.createGraphics(side, side);
        buf.pixelDensity(1);
      }
      buf.clear();
      buf.image(src, 0, 0, side, side);
      buf.loadPixels();
    }

    function plan(){
      queue = []; cursor = 0;
      if (!buf || !buf.pixels || !buf.pixels.length) return;

      var px = buf.pixels, c = side/2, reach = c - TILE * 0.4, x, y, i, l, d;

      /* pass one: the tiles that fall inside the hoop, with their light */
      for (x = TILE/2; x < side; x += TILE){
        for (y = TILE/2; y < side; y += TILE){
          d = Math.hypot(x - c, y - c);
          if (d > reach) continue;                      /* outside the hoop */
          i = 4 * ((y | 0) * side + (x | 0));
          l = 0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2];
          queue.push({x:x, y:y, l:l, d:d});
        }
      }
      if (!queue.length) return;

      /* pass two: cut at this cat's own quartiles, so every cat fills
         the palette however it happened to be lit */
      var ranked = queue.map(function(t){ return t.l; }).sort(function(a,b){ return a-b; });
      var cuts = [], n = STEPS.length;
      for (var j = 1; j < n; j++) cuts.push(ranked[Math.floor(ranked.length * j / n)]);

      var palette = STEPS.map(function(name){ return token(name) || '#502064'; });
      for (var k = 0; k < queue.length; k++){
        var step = 0;
        while (step < cuts.length && queue[k].l > cuts[step]) step++;
        queue[k].col    = palette[step];
        queue[k].weight = TILE * (0.52 - step * 0.07);  /* darker draws heavier */
        queue[k].flip   = Math.random() < 0.5;
      }

      /* draw from the middle out, so it opens like a hoop */
      queue.sort(function(a, b){ return a.d - b.d; });
    }

    function tileAt(t){
      p.stroke(t.col);
      p.strokeWeight(t.weight);
      if (t.flip){
        p.arc(t.x - TILE/2, t.y - TILE/2, TILE, TILE, 0, 90);
        p.arc(t.x + TILE/2, t.y + TILE/2, TILE, TILE, 180, 270);
      } else {
        p.arc(t.x + TILE/2, t.y - TILE/2, TILE, TILE, 90, 180);
        p.arc(t.x - TILE/2, t.y + TILE/2, TILE, TILE, 270, 360);
      }
    }

    /* own ticker rather than p5's draw loop: the trace is a one-shot
       animation with a definite end, not a running sketch */
    function tick(){
      var budget = Math.max(6, Math.ceil(queue.length / 70));
      for (var n = 0; n < budget && cursor < queue.length; n++) tileAt(queue[cursor++]);
      raf = cursor < queue.length ? requestAnimationFrame(tick) : null;
    }

    function restart(){
      if (raf){ cancelAnimationFrame(raf); raf = null; }
      p.background(token('--bg') || '#FBFBF8');
      plan();
      if (still){ while (cursor < queue.length) tileAt(queue[cursor++]); }
      else if (queue.length) raf = requestAnimationFrame(tick);
    }

    function fetchCat(){
      if (again) again.disabled = true;
      p.loadImage(CAT + '&t=' + Date.now(), function(img){
        if (again) again.disabled = false;
        src = img;
        rescale();
        restart();
      }, function(){
        /* offline, or cataas is down: leave the paper blank rather
           than parking an error box in the hero */
        if (again) again.disabled = false;
      });
    }

    function resize(){
      var s = measure();
      if (!s || s === side) return;
      side = s;
      p.resizeCanvas(side, side);
      rescale();
      restart();
    }

    p.setup = function(){
      side = measure() || MIN;
      var c = p.createCanvas(side, side);
      c.parent(holder);
      c.mousePressed(fetchCat);
      p.angleMode(p.DEGREES);
      p.noFill();
      p.strokeCap(p.ROUND);
      p.background(token('--bg') || '#FBFBF8');
      p.noLoop();
      if (again) again.addEventListener('click', fetchCat);
      fetchCat();

      /* nav.js injects the nav and footer after load, so the real
         column width only exists later — watch for it rather than
         trusting the layout at setup */
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(holder);
      else window.addEventListener('resize', resize);
    };
  });
})();
</script>
