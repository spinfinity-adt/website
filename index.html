<link rel="icon" type="image/png" href="/favicon.png">
<title>Spinfinity</title>
<link rel="stylesheet" href="/styles.css"/>
<style>
.hero{display:flex;flex-direction:column;justify-content:center;gap:1.8rem;min-height:calc(100vh - var(--nav-h));padding:clamp(2rem,6vw,5rem) clamp(1.2rem,5vw,3.5rem) 3rem;max-width:700px}
.logo-area{position:relative;display:inline-block;align-self:flex-start}
.logo{font-family:var(--hand);font-size:clamp(3.5rem,13vw,9rem);font-weight:700;line-height:.88;color:var(--fg);text-shadow:0 0 60px rgba(63,167,150,.2)}
.logo .inf{color:var(--accent2);text-shadow:0 0 30px rgba(63,167,150,.6),0 0 80px rgba(63,167,150,.3)}
.logo-area::after{content:'';display:block;height:5px;margin-top:.5rem;background:linear-gradient(90deg,var(--accent2),var(--accent3));border-radius:10px;transform:rotate(-1.2deg) scaleX(0);transform-origin:left;animation:underline-draw .9s cubic-bezier(.16,1,.3,1) .4s forwards;box-shadow:0 0 12px rgba(63,167,150,.5)}
.tagline{font-family:var(--hand);font-size:clamp(1.1rem,3vw,1.8rem);line-height:1.55;max-width:520px;font-weight:400}
.tagline .math{color:var(--accent2);font-style:italic}
.tagline .hoop{color:var(--accent2)}
.hero-cta{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.cta-btn{font-family:var(--hand);font-size:1.1rem;font-weight:700;text-decoration:none;padding:.55rem 1.4rem;border-radius:2px;transition:all .22s ease}
.cta-primary{background:var(--accent2);color:var(--bg)}
.cta-primary:hover{box-shadow:0 0 24px rgba(63,167,150,.55);transform:translateY(-2px) scale(1.03)}
.cta-ghost{color:var(--fg);border:2px solid rgba(255,255,255,.18)}
.cta-ghost:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-2px)}
@media(max-width:480px){
  .hero-cta{gap:.7rem}
  .cta-btn{font-size:1rem;padding:.5rem 1.1rem}
}
</style>
