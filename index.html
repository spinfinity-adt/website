<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
/* ============================================================
   truchet true cat tiles — Aditi's sketch, wired into the page.

   Her draw loop, unchanged: black ground, one truchet tile per
   cell, each arc stroked with the cat's colour at that tile's
   centre, a fresh coin flip every frame at frameRate(2) so the
   weave keeps reshuffling. Then the cat itself is multiplied back
   over the top, so the tiles mask it: the photo comes through
   where the arcs are and the gaps stay black.

   Two things differ from the standalone sketch, both forced by
   living on a page rather than in its own 800x800 window:

   - the canvas is the panel's size, not 800x800, and the cat is
     requested at those dimensions so it still lands 1:1 with the
     tiles the way catImg.resize(width, height) intends.
   - the tile colours are sampled once when the image loads rather
     than via get(x, y) inside the loop. get() runs a getImageData
     call per tile; at this canvas size that is ~6000 of them per
     frame, twice a second. Same colours, read once instead.
   ============================================================ */
(function(){
  var holder = document.getElementById('truchet-cat');
  var again  = document.getElementById('cat-again');
  if (!holder || typeof p5 === 'undefined') return;

  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  new p5(function(p){
    var catImg = null, colours = null;
    var w = 0, h = 0, size = 10, cols = 0, rows = 0;

    function measure(){
      var r = holder.getBoundingClientRect();
      return { w: Math.round(r.width), h: Math.round(r.height) };
    }

    /* catImg.get(x, y) for every tile centre, done once */
    function sample(){
      colours = null;
      if (!catImg) return;
      catImg.loadPixels();
      if (!catImg.pixels || !catImg.pixels.length) return;

      cols = Math.ceil(w / size);
      rows = Math.ceil(h / size);
      colours = new Array(cols * rows);

      var px = catImg.pixels, iw = catImg.width, ih = catImg.height, c, r, x, y, i;
      for (c = 0; c < cols; c++){
        for (r = 0; r < rows; r++){
          x = Math.min(iw - 1, Math.floor(c * size + size/2));
          y = Math.min(ih - 1, Math.floor(r * size + size/2));
          i = 4 * (y * iw + x);
          colours[r * cols + c] = p.color(px[i], px[i+1], px[i+2]);
        }
      }
    }

    function fetchCat(){
      if (again) again.disabled = true;
      p.loadImage('https://cataas.com/cat?width=' + w + '&height=' + h +
                  '&t=' + Date.now(), function(img){
        if (again) again.disabled = false;
        catImg = img;
        catImg.resize(w, h);   // 1:1 with canvas so the tiles line up
        sample();
        if (still) p.redraw();
      }, function(){
        /* offline, or cataas is down: leave it black rather than
           parking an error box in the hero */
        if (again) again.disabled = false;
      });
    }

    p.setup = function(){
      var m = measure();
      w = m.w || 400; h = m.h || 400;
      var c = p.createCanvas(w, h);
      c.parent(holder);
      c.mousePressed(fetchCat);
      p.angleMode(p.DEGREES);
      p.frameRate(2);
      p.background('Black');
      if (still) p.noLoop();   /* no shimmer if the visitor asked for none */
      if (again) again.addEventListener('click', fetchCat);
      fetchCat();

      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(holder);
      else window.addEventListener('resize', resize);
    };

    p.draw = function(){
      p.blendMode(p.BLEND);
      p.background('Black');
      if (!colours) return;
      p.noFill();
      p.strokeWeight(size * 0.4);

      var c, r, x, y, choice;
      for (c = 0; c < cols; c++){
        x = c * size + size/2;
        for (r = 0; r < rows; r++){
          y = r * size + size/2;

          p.stroke(colours[r * cols + c]);

          choice = p.random(0, 1);
          if (choice < 0.5) {
            p.arc(x - size/2, y - size/2, size, size, 0, 90);
            p.arc(x + size/2, y + size/2, size, size, 180, 270);
          } else {
            p.arc(x + size/2, y - size/2, size, size, 90, 180);
            p.arc(x - size/2, y + size/2, size, size, 270, 0);
          }
        }
      }

      /* the tiles become the mask: the cat multiplied back through them */
      p.blendMode(p.MULTIPLY);
      p.image(catImg, 0, 0, w, h);
      p.blendMode(p.BLEND);
    };

    function resize(){
      var m = measure();
      if (!m.w || !m.h || (m.w === w && m.h === h)) return;
      w = m.w; h = m.h;
      p.resizeCanvas(w, h);
      if (!catImg) { fetchCat(); return; }
      catImg.resize(w, h);
      sample();
      if (still) p.redraw();
    }

    p.keyPressed = function(){
      if (p.key === 's') p.saveCanvas('truchet-cat.jpg');
      if (p.key === 'g') p.saveGif('truchet-cat.gif', 5);
    };
  });
})();
</script>
